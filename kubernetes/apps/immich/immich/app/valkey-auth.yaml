---
# Password for Immich's bundled Valkey. Generated in-cluster once
# (refreshInterval "0": never regenerated), so it is not in git or
# 1Password. Valkey gets it as REDISCLI_AUTH (also used by the chart's
# "valkey-cli ping" probes) and requires it with --requirepass; the server
# gets it as REDIS_PASSWORD (helmrelease.yaml).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: immich-valkey
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-valkey-auth
spec:
  refreshInterval: "0"
  target:
    name: immich-valkey-auth
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: immich-valkey
