---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich

spec:
  interval: 1h
  # app-template's schema allows neither pod.volumes nor container
  # volumeMounts, so the db-bridge volumes and their mounts are added here
  # (strategic merge: containers merge by name, volumes by name).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: immich-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: immich-server
              spec:
                template:
                  spec:
                    volumes:
                      # SPIRE agent Workload API socket
                      - name: spiffe
                        csi:
                          driver: csi.spiffe.io
                          readOnly: true
                      # SVID files written by spiffe-helper, read by the bridge
                      - name: svid
                        emptyDir: {}
                      # immich-postgres server CA (published by the
                      # spire-ca-bridge CronJob)
                      - name: cnpg-ca
                        secret:
                          secretName: immich-postgres-server-ca
                    containers:
                      - name: db-bridge
                        volumeMounts:
                          - name: spiffe
                            mountPath: /run/spiffe
                            readOnly: true
                          - name: svid
                            mountPath: /spiffe
                          - name: cnpg-ca
                            mountPath: /cnpg-ca
                            readOnly: true
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 0.13.4
      url: oci://ghcr.io/immich-app/immich-charts/immich
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.1.0
            envFrom:
              - secretRef:
                  name: immich-db-config
            securityContext:
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              seccompProfile: { type: RuntimeDefault }
              privileged: false
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    valkey:
      enabled: true
      # Require a password (generated secret, valkey-auth.yaml). valkey-cli
      # reads REDISCLI_AUTH, so the chart's "valkey-cli ping" probes keep
      # working unchanged.
      controllers:
        main:
          containers:
            main:
              args:
                - valkey-server
                - --requirepass
                - $(REDISCLI_AUTH)
              env:
                REDISCLI_AUTH:
                  valueFrom:
                    secretKeyRef:
                      name: immich-valkey-auth
                      key: password

    # Server-only values. The top-level controllers block is shared by
    # every Immich component (server, machine-learning, valkey), so the
    # db-bridge sidecar must live here: only the server uses Postgres.
    server:
      controllers:
        main:
          containers:
            main:
              env:
                REDIS_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-valkey-auth
                      key: password
            # SPIFFE-aware Postgres bridge: spiffe-helper fetches/rotates the
            # SVID (CN=immich); the bridge serves the app on loopback and presents
            # the SVID to immich-postgres-rw.database.svc:5432 (pg_hba "cert"). No DB password involved.
            # (volumeMounts are added by the postRenderer: the chart schema does not
            # allow them in values)
            db-bridge:
              image:
                repository: ghcr.io/ronaldphilipsen/db-bridge
                tag: 1.3.0@sha256:a56fc5a98e33f767227541f99c441728b42a08bee4a1b940c1a93fcb344fa1f0
              env:
                DB_BRIDGE_UPSTREAM: immich-postgres-rw.database.svc:5432
              probes:
                # the bridge listens on loopback only, so a kubelet tcpSocket probe
                # (which dials the pod IP) can never work; ask the binary
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    exec:
                      command:
                        - db-bridge
                        - -health
                    initialDelaySeconds: 15
                    periodSeconds: 15
                    timeoutSeconds: 3
                    failureThreshold: 3
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: photos-nfs
      configurationKind: Secret
      existingConfiguration: immich-config
    machine-learning:
      controllers:
        main:
          containers:
            main:
              securityContext:
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                seccompProfile: { type: RuntimeDefault }
                privileged: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
