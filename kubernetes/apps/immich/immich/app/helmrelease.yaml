---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich

spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 0.13.4
      url: oci://ghcr.io/immich-app/immich-charts/immich
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.1.0
            envFrom:
              - secretRef:
                  name: immich-db-config
            securityContext:
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              seccompProfile: { type: RuntimeDefault }
              privileged: false
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    valkey:
      enabled: true

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: photos-nfs
      configurationKind: Secret
      existingConfiguration: immich-config
    machine-learning:
      controllers:
        main:
          containers:
            main:
              securityContext:
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                seccompProfile: { type: RuntimeDefault }
                privileged: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
