---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-local-network-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-ops-runner
  egressDeny:
    - toCIDRSet:
        - cidr: 10.0.0.0/8
          except:
            - 10.42.0.0/16
            - 10.43.0.0/16
        - cidr: 172.16.0.0/12
          except:
            - 172.16.20.0/24
        - cidr: 192.168.0.0/16
          except:
            - 192.168.0.2/32
        - cidr: 169.254.0.0/16
