# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-operator
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 0.37.2
        digest: sha256:21c5b4c31db35952b32d17ea95f4656fb999a7327116185a0ad105252384b37d
      url: oci://ghcr.io/intel/helm-charts/intel-device-plugins-operator
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    manager:
      devices:
        gpu: true
