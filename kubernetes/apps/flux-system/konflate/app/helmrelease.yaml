---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.6.6
      url: oci://ghcr.io/home-operations/charts/konflate
  interval: 1h
  values:
    config:
      repo: github://RonaldPhilipsen/home-ops
      prComments: true
      statusChecks: true
      publicUrl: "https://konflate.rphilipsen.nl"
    secret:
      existingSecret: konflate-webhook-token-secret
    httpRoute:
      enabled: true
      labels:
        expose: public
      annotations:
        reloader.stakater.com/auto: "true"
      parentRefs:
        - name: external
          namespace: kube-system
      hostnames:
        - "{{ .Release.Name }}.rphilipsen.nl"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 1Gi
