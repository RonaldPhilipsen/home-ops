---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 10m
      ref:
        tag: 0.62.0
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    serviceMonitor:
      create: true
    web:
      networkPolicy:
        create: false
