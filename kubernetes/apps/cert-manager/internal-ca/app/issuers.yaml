---
# Internal CA for HTTPS between in-cluster clients / the gateways and app
# backends that serve TLS natively. The root key is generated by
# cert-manager and exists only in the cluster (secret internal-root-ca).
# Every certificate issued by internal-ca carries the CA as ca.crt.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-selfsigned
spec:
  selfSigned: {}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-root-ca
spec:
  isCA: true
  commonName: rphilipsen.nl internal CA
  subject:
    organizations:
      - rphilipsen
  secretName: internal-root-ca
  duration: 87600h # 10y
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: internal-selfsigned
---
# Issues the backend certificates (Certificate resources next to each app).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-root-ca
