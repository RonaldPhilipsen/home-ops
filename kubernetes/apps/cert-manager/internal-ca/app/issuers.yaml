---
# Internal CA for HTTPS between in-cluster clients / the gateways and app
# backends that serve TLS natively. The root key is generated by
# cert-manager and exists only in the cluster (secret internal-root-ca).
# Every certificate issued by internal-ca carries the CA as ca.crt.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-selfsigned
spec:
  selfSigned: {}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-root-ca
spec:
  isCA: true
  commonName: rphilipsen.nl internal CA
  subject:
    organizations:
      - rphilipsen
  secretName: internal-root-ca
  duration: 87600h # 10y
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: internal-selfsigned
---
# Issues the backend certificates (Certificate resources next to each app).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-root-ca
---
# Copies the internal CA certificate (only tls.crt, never the key) as
# ConfigMap internal-ca (key ca.crt) into every namespace. Cilium's
# BackendTLSPolicy accepts only ConfigMap CA refs, so cert-manager's ca.crt
# in the issued secrets is not enough for the gateway.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/trust.cert-manager.io/bundle_v1alpha1.json
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: internal-ca
spec:
  sources:
    - secret:
        name: internal-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
