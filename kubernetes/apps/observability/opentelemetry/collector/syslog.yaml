---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: syslog
spec:
  mode: statefulset
  replicas: 1
  ports:
    - name: syslog-udp
      port: 5514
      protocol: UDP
      targetPort: 5514
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  volumeMounts:
    - mountPath: /var/lib/otelcol/storage
      name: storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: openebs-hostpath
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    readOnlyRootFilesystem: true
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    runAsUser: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/storage
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      syslog/omada:
        udp:
          listen_address: 0.0.0.0:5514
          # AP firewall dumps cram several "[epoch] AP MAC=..." records into one UDP packet
          # line_end_pattern must be explicitly cleared: it defaults to a never-matching regex, which conflicts with line_start_pattern
          multiline:
            line_start_pattern: '\[\d+\.\d+\]'
            line_end_pattern: ""
        protocol: none
        location: Europe/Amsterdam
        operators:
        - type: syslog_parser
          protocol: none
          on_error: send
        - type: router
          routes:
          - output: parse_ap_traffic
            expr: 'body matches "AP MAC="'
          - output: parse_gateway_dhcp
            expr: 'body matches "dhcp_server"'
          default: noop
        - id: parse_ap_traffic
          type: regex_parser
          parse_from: body
          on_error: send
          # Unanchored: matches "AP MAC=" wherever it occurs, regardless of what precedes it
          regex: '(?:\[(?P<epoch>[\d.]+)\]\s+)?AP\s+MAC=(?P<ap_mac>\S+)\s*(?P<kv>.*)$'
        # Normalize multi-word keys to single tokens so key_value_parser can pick up any subset, in any order
        - id: ap_kv_rename_src_mac
          type: regex_replace
          field: attributes.kv
          regex: 'MAC\s+SRC='
          replace_with: 'src_mac='
        - id: ap_kv_rename_src_ip
          type: regex_replace
          field: attributes.kv
          regex: 'IP\s+SRC='
          replace_with: 'src_ip='
        - id: ap_kv_rename_dst_ip
          type: regex_replace
          field: attributes.kv
          regex: 'IP\s+DST='
          replace_with: 'dst_ip='
        - id: ap_kv_rename_proto
          type: regex_replace
          field: attributes.kv
          regex: 'IP\s+proto='
          replace_with: 'proto='
        - id: ap_kv_rename_src_port
          type: regex_replace
          field: attributes.kv
          regex: '\bSPT='
          replace_with: 'src_port='
        - id: ap_kv_rename_dst_port
          type: regex_replace
          field: attributes.kv
          regex: '\bDPT='
          replace_with: 'dst_port='
        - id: parse_ap_kv
          type: key_value_parser
          parse_from: attributes.kv
          on_error: send
        - id: remove_ap_kv
          type: remove
          field: attributes.kv
          output: noop
        - id: parse_gateway_dhcp
          type: regex_parser
          parse_from: body
          on_error: send
          regex: '^(?:<\d+>[A-Za-z]{3}\s+\d+\s+\d{2}:\d{2}:\d{2}\s+\S+:\s+)?(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+(?P<hostname>[\w.-]+)(?:<\d+>)?:\s+(?P<message>.*)$'
        - id: noop
          type: noop
    processors:
      batch: {}
      logdedup:
        interval: 60s
        log_count_attribute: dedup_count
        timezone: "Europe/Amsterdam"
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      resource:
        attributes:
          - key: k8s.cluster.name
            value: k8s-neo-alpha
            action: upsert
      resourcedetection:
        detectors:
          - env
          - system
        timeout: 2s
        override: false
    exporters:
      otlphttp/victoriametrics:
        logs_endpoint: http://victoria-logs-server.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: k8s.cluster.name,k8s.namespace.name,k8s.pod.name,k8s.container.name,service.name,service.namespace
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 10000
          storage: file_storage
    service:
      extensions:
        - health_check
        - file_storage
      pipelines:
        logs:
          receivers:
            - syslog/omada
          processors:
            - memory_limiter
            - resourcedetection
            - resource
            - logdedup
            - batch
          exporters:
            - otlphttp/victoriametrics
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://vmsingle-vmetrics.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
