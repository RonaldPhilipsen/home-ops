---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: syslog
spec:
  mode: statefulset
  replicas: 1
  ports:
    - name: syslog-udp
      port: 5514
      protocol: UDP
      targetPort: 5514
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  volumeMounts:
    - mountPath: /var/lib/otelcol/storage
      name: storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: local-hostpath
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    readOnlyRootFilesystem: true
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    runAsUser: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/storage
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      syslog/omada:
        udp:
          listen_address: 0.0.0.0:5514
          # AP firewall dumps cram several "[epoch] AP MAC=..." records into one packet, separated by \r\n
          # line_start_pattern doesn't work here: it splits between *matches*, so the leading
          # syslog envelope (before the first "[epoch]") gets emitted as its own truncated entry
          multiline:
            line_end_pattern: '\r\n'
            omit_pattern: true
        protocol: none
        location: Europe/Amsterdam
        operators:
        - type: syslog_parser
          protocol: none
          on_error: send
        - type: router
          routes:
          - output: parse_ap_traffic
            expr: 'body matches "AP MAC="'
          - output: parse_gateway_dhcp
            expr: 'body matches "dhcp_server"'
          - output: parse_gateway_acl
            expr: 'body matches "\\[ACL\\]"'
          - output: parse_controller
            expr: 'body matches "^<\\d+>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2}\\s+\\S+\\s+\\["'
          - output: parse_switch
            expr: 'body matches "^<\\d+>\\d{4}-\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}:\\d{2}\\s+\\S+\\s+\\d+\\s+"'
          default: noop
        - id: parse_ap_traffic
          type: regex_parser
          parse_from: body
          on_error: send
          # Unanchored: matches "AP MAC=" wherever it occurs, regardless of what precedes it
          regex: '(?:\[[\d.]+\]\s+)?AP\s+MAC=(?P<ap_mac>\S+)\s*(?P<kv>.*)$'
        # Normalize multi-word keys to single tokens so key_value_parser can pick up any subset, in any order
        - id: ap_kv_rename_src_mac
          type: regex_replace
          field: attributes.kv
          regex: 'MAC\s+SRC='
          replace_with: 'src_mac='
        - id: ap_kv_rename_src_ip
          type: regex_replace
          field: attributes.kv
          regex: 'IP\s+SRC='
          replace_with: 'src_ip='
        - id: ap_kv_rename_dst_ip
          type: regex_replace
          field: attributes.kv
          regex: 'IP\s+DST='
          replace_with: 'dst_ip='
        - id: ap_kv_rename_proto
          type: regex_replace
          field: attributes.kv
          regex: 'IP\s+proto='
          replace_with: 'proto='
        - id: ap_kv_rename_src_port
          type: regex_replace
          field: attributes.kv
          regex: '\bSPT='
          replace_with: 'src_port='
        - id: ap_kv_rename_dst_port
          type: regex_replace
          field: attributes.kv
          regex: '\bDPT='
          replace_with: 'dst_port='
        - id: parse_ap_kv
          type: key_value_parser
          parse_from: attributes.kv
          on_error: send
        - id: remove_ap_kv
          type: remove
          field: attributes.kv
          output: noop
        - id: parse_gateway_dhcp
          type: regex_parser
          parse_from: body
          on_error: send
          regex: '^(?:<\d+>[A-Za-z]{3}\s+\d+\s+\d{2}:\d{2}:\d{2}\s+\S+:\s+)?(?:\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+(?P<hostname>[\w.-]+)(?:<\d+>)?:\s+(?P<message>.*)$'
          output: noop
        - id: parse_gateway_acl
          type: regex_parser
          parse_from: body
          on_error: send
          # Gateway firewall ACL fields arrive in a fixed order, so capture them in one pass.
          # Trailing fields are ignored, so adding a field at the end won't break parsing.
          regex: '\[ACL\]\s*GATEWAY=(?P<gateway_mac>[^,]+),DESC=(?P<rule_id>[^,]*),ACTION=(?P<action>[^,]+),SRC_MAC=(?P<src_mac>[^,]+),DST_MAC=(?P<dst_mac>[^,]+),SRC=(?P<src_ip>[^,]+),DST=(?P<dst_ip>[^,]+),PROTO=(?P<proto>[^,]+),Sport=(?P<src_port>\d+),Dport=(?P<dst_port>\d+)'
          output: noop
        # Controller-generated records follow RFC3164: "<PRI>Mon DD HH:MM:SS Controller [Module/Client Info] Message"
        - id: parse_controller
          type: syslog_parser
          protocol: rfc3164
          location: Europe/Amsterdam
          on_error: send
        - id: parse_controller_module
          type: regex_parser
          parse_from: attributes.message
          on_error: send
          regex: '^\[(?P<module>[^\]]+)\]\s*(?P<message>.*)$'
          output: noop
        # Switch records: "<PRI>YYYY-MM-DD HH:MM:SS SwitchModel Index/LogID Message"
        - id: parse_switch
          type: regex_parser
          parse_from: body
          on_error: send
          regex: '^<\d+>(?P<switch_timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+(?P<switch_model>\S+)\s+(?P<log_id>\d+)\s+(?P<message>.*)$'
          timestamp:
            parse_from: attributes.switch_timestamp
            layout_type: strptime
            layout: '%Y-%m-%d %H:%M:%S'
            location: Europe/Amsterdam
        - id: remove_switch_timestamp
          type: remove
          field: attributes.switch_timestamp
          output: noop
        - id: noop
          type: noop
    processors:
      batch: {}
      logdedup:
        interval: 60s
        log_count_attribute: dedup_count
        timezone: "Europe/Amsterdam"
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      resource:
        attributes:
          - key: k8s.cluster.name
            value: k8s-neo-alpha
            action: upsert
      resourcedetection:
        detectors:
          - env
          - system
        timeout: 2s
        override: false
    exporters:
      otlphttp/victoriametrics:
        logs_endpoint: http://vlsingle-vmetrics.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: k8s.cluster.name,k8s.namespace.name,k8s.pod.name,k8s.container.name,service.name,service.namespace
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 10000
          storage: file_storage
    service:
      extensions:
        - health_check
        - file_storage
      pipelines:
        logs:
          receivers:
            - syslog/omada
          processors:
            - memory_limiter
            - resourcedetection
            - resource
            - logdedup
            - batch
          exporters:
            - otlphttp/victoriametrics
      telemetry:
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://vmsingle-vmetrics.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
