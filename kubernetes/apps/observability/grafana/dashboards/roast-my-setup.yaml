---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: roast-my-setup
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  # Public dashboards resolve datasources by UID only, so the UID of the
  # "prometheus" GrafanaDatasource is set directly in the panels below.
  # VictoriaMetrics stores OTLP names with dots, so Omada metrics use {__name__="..."}.
  json: |
