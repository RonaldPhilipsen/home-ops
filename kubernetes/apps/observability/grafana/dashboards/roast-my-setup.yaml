            {
              "datasource": {
                "type": "prometheus",
                "uid": "658f7554-74f9-4bc4-817e-659f389c1093"
              },
              "expr": "sum({__name__=\"omada.site.clients\"})",
              "refId": "A",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
