            "legend": {
              "displayMode": "list",
              "placement": "right",
              "showLegend": true
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:* | format \"Syslog\" as source | format if (_msg:\"[ACL]\") \"Firewall ACL\" as source | format if (hostname:dhcp_server) \"DHCP\" as source | format if (_msg:\"[ap:\") \"Wireless AP\" as source | format if (_msg:\"conflicted ip\") \"IP conflict\" as source | format if (switch_model:*) \"Switch\" as source | format if (facility_text:local3) \"Controller audit\" as source | format if (facility_text:auth) \"Auth\" as source | stats by (source) sum(dedup_count) as events | sort by (events desc)",
              "legendFormat": "{{source}}",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Events by source",
          "type": "piechart"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "id": 14,
          "panels": [],
          "title": "Firewall (gateway ACL)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "Denied connections over time. A spike usually means a client is retrying a blocked service, probing, or a new device is misconfigured.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
