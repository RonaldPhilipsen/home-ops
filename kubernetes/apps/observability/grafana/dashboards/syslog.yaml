# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: syslog-omada
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: victoria-logs
      inputName: DS_VLOGS
  json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Interpret Omada gateway, AP, switch and controller syslog records stored in VictoriaLogs. All panels filter on facility_text, which is only set for syslog data, so Kubernetes logs and events are excluded.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": true,
          "title": "VictoriaLogs UI",
          "tooltip": "Open the raw syslog stream in VictoriaLogs",
          "type": "link",
          "url": "https://vlogs.rphilipsen.nl/select/vmui/"
        }
      ],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "All syslog records in the selected range, summed over the collector's dedup_count. This excludes Kubernetes container logs and events.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:* | stats sum(dedup_count) as events",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Syslog events",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "Age of the newest syslog record. A rising value means the gateway/APs stopped shipping or the OTel syslog collector is stalled.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 300
                  },
                  {
                    "color": "red",
                    "value": 900
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:* | first 1 by (_time desc) | math (now() - _time) / 1000000000 as lag_s | stats max(lag_s) as lag_s",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Last syslog age",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "Gateway ACL records with ACTION=Block. These are parsed into src_ip, dst_ip, proto and port fields.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:user _msg:\"[ACL]\" | extract if (action:\"\") \"[ACL]GATEWAY=<gateway_mac>,DESC=<rule_id>,ACTION=<action>,SRC_MAC=<src_mac>,DST_MAC=<dst_mac>,SRC=<src_ip>,DST=<dst_ip>,PROTO=<proto>,Sport=<src_port>,Dport=<dst_port>\" | stats sum(dedup_count) as blocks",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Firewall blocks",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "Distinct LAN client IPs with at least one denied connection in the range.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:user _msg:\"[ACL]\" | extract if (action:\"\") \"[ACL]GATEWAY=<gateway_mac>,DESC=<rule_id>,ACTION=<action>,SRC_MAC=<src_mac>,DST_MAC=<dst_mac>,SRC=<src_ip>,DST=<dst_ip>,PROTO=<proto>,Sport=<src_port>,Dport=<dst_port>\" | stats count_uniq(src_ip) as clients",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Blocked clients",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "DHCP allocations reported by the ER8411 gateway.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:user hostname:dhcp_server | stats sum(dedup_count) as leases",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "DHCP leases",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "IP address conflicts reported by the gateway, counting both 'used conflicted ip' and 'conflicted ip resolved' lines.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:* _msg:\"conflicted ip\" | stats sum(dedup_count) as conflicts",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "IP conflicts",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "Events emitted by the Omada access points, such as admission control, load balancing and roaming decisions.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "id": 8,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "_msg:\"[ap:\" | stats sum(dedup_count) as events",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Wireless AP events",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "Controller configuration audit records plus syslog auth records. Low volume, but usually the first place to look after an unexpected change.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "id": 9,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:(local3 OR auth) | stats sum(dedup_count) as events",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "title": "Config & auth events",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 10,
          "panels": [],
          "title": "Volume & sources",
          "type": "row"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "Stacked event count per payload type. Use this to see which device class is responsible for a change in syslog volume.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:* | format \"Syslog\" as source | format if (_msg:\"[ACL]\") \"Firewall ACL\" as source | format if (hostname:dhcp_server) \"DHCP\" as source | format if (_msg:\"[ap:\") \"Wireless AP\" as source | format if (_msg:\"conflicted ip\") \"IP conflict\" as source | format if (switch_model:*) \"Switch\" as source | format if (facility_text:local3) \"Controller audit\" as source | format if (facility_text:auth) \"Auth\" as source | stats by (source) sum(dedup_count) as events",
              "legendFormat": "{{source}}",
              "queryType": "statsRange",
              "refId": "A"
            }
          ],
          "title": "Syslog volume by source",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "Syslog severity split. Most gateway traffic is notice; warning, err and crit are the lines worth reading.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 6,
            "x": 12,
            "y": 6
          },
          "id": 12,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VLOGS}"
              },
              "editorMode": "code",
              "expr": "facility_text:* | stats by (severity_text) sum(dedup_count) as events",
              "legendFormat": "{{severity_text}}",
              "queryType": "statsRange",
              "refId": "A"
            }
          ],
          "title": "Events by severity",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VLOGS}"
          },
          "description": "Share of syslog records by payload type. A sudden jump in Wireless AP or Auth can point at a client or configuration problem.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 6,
            "x": 18,
            "y": 6
          },
          "id": 13,
