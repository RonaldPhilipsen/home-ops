---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  # internal CA for the HTTPS backend, filled in by the Grafana operator
  valuesFrom:
    - targetPath: secureJsonData.tlsCACert
      valueFrom:
        configMapKeyRef:
          name: internal-ca
          key: ca.crt
  datasource:
    type: prometheus
    orgId: 1
    name: prometheus
    access: proxy
    isDefault: true
    url: https://vmsingle-vmetrics-tls.observability.svc.cluster.local:18428
    jsonData:
      tlsAuthWithCACert: true
      timeInterval: 1s
    secureJsonData:
      # replaced by the operator with valuesFrom (key ca.crt)
      tlsCACert: ${ca.crt}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  # internal CA for the HTTPS backend, filled in by the Grafana operator
  valuesFrom:
    - targetPath: secureJsonData.tlsCACert
      valueFrom:
        configMapKeyRef:
          name: internal-ca
          key: ca.crt
  datasource:
    type: alertmanager
    orgId: 1
    name: alertmanager
    access: proxy
    jsonData:
      implementation: prometheus
      tlsAuthWithCACert: true
    secureJsonData:
      # replaced by the operator with valuesFrom (key ca.crt)
      tlsCACert: ${ca.crt}
    url: https://vmalertmanager-vmetrics.observability.svc.cluster.local:9093
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-traces
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  # internal CA for the HTTPS backend, filled in by the Grafana operator
  valuesFrom:
    - targetPath: secureJsonData.tlsCACert
      valueFrom:
        configMapKeyRef:
          name: internal-ca
          key: ca.crt
  datasource:
    # tempo type (not jaeger): VictoriaTraces serves the Tempo query API
    # under /select/tempo, which the Tempo datasource needs for TraceQL and
    # the trace-search panels on the omada dashboard.
    type: tempo
    orgId: 1
    uid: victoria-traces
    name: victoria-traces
    access: proxy
    url: https://vtsingle-vmetrics-tls.observability.svc.cluster.local:20428/select/tempo
    jsonData:
      tlsAuthWithCACert: true
    secureJsonData:
      # replaced by the operator with valuesFrom (key ca.crt)
      tlsCACert: ${ca.crt}

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
