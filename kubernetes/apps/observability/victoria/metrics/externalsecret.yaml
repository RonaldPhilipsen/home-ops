---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmbackup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vmbackup-credentials
    template:
      engineVersion: v2
      data:
        # -- credentials file consumed by vmbackupmanager (vm-backup bucket access key)
        credentials.json: |-
          {
            "accessKey": "{{ .AWS_ACCESS_KEY_ID }}",
            "secretKey": "{{ .AWS_SECRET_ACCESS_KEY }}"
          }
  dataFrom:
    - extract:
        key: victoriametrics
