---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmbackup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vmbackup-credentials
    template:
      engineVersion: v2
      data:
        # -- credentials file consumed by vmbackup (vm-backup bucket access key).
        #    vmbackup passes the file to the AWS SDK v2 as a shared credentials
        #    file (config.WithSharedCredentialsFiles), so it must be AWS INI
        #    format. A JSON file is silently ignored and the SDK falls back
        #    to the IMDS role chain, failing with "no EC2 IMDS role found".
        credentials: |-
          [default]
          aws_access_key_id = {{ .AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = {{ .AWS_SECRET_ACCESS_KEY }}
  dataFrom:
    - extract:
        key: victoriametrics
