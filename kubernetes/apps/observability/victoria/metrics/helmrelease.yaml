---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-k8s-stack
  namespace: observability
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: vm-k8s-stack
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      cluster:
        # -- K8s cluster domain suffix, uses for building storage pods' FQDN. Details are [here](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/)
        dnsDomain: cluster.local.
    fullnameOverride: vmetrics

    crds:
      enabled: false

    victoria-metrics-operator:
      enabled: true

    defaultDashboards:
      enabled: true
      grafanaOperator:
        enabled: true

    defaultRules:
      create: true

    alertmanager:
      enabled: true
      spec:
        disableNamespaceMatcher: true

    vmalert:
      enabled: true

    grafana:
      enabled: false

    vmsingle:
      enabled: true
      spec:
        extraArgs:
          maxLabelsPerTimeseries: "40"
          search.maxUniqueTimeseries: "600000"
          search.minStalenessInterval: 5m
        retentionPeriod: "6w"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 2000
          runAsGroup: 2000
          fsGroup: 2000
          fsGroupChangePolicy: Always
          seccompProfile:
            type: RuntimeDefault
        persistentVolume:
          enabled: true
          storageClassName: openebs-hostpath
          size: 100Gi
      route:
        enabled: true
        parentRefs:
          - name: agentgateway-internal
            namespace: network
        hostnames: ["vmsingle.rphilipsen.nl"]

    vmagent:
      enabled: true
      spec:
        resources:
          limits:
            memory: 1Gi
            cpu: 1
          requests:
            cpu: 150m
        selectAllByDefault: true
        scrapeInterval: 20s

    defaultDatasources:
      grafanaOperator:
        # -- Create datasources as CRDs (requires grafana-operator to be installed)
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: true

    prometheus-node-exporter:
      enabled: true

    kube-state-metrics:
      enabled: true

    kubelet:
      enabled: false

    kubeApiServer:
      enabled: false

    kubeControllerManager:
      enabled: false
      service:
        selector:
          component: kube-apiserver # Selects controller node IPs
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeEtcd:
      enabled: false
      service:
        selector:
          component: kube-apiserver # Selects controller node IPs
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - scheme: http

    kubeScheduler:
      enabled: false

    kubeProxy:
      enabled: false

    coreDns:
      enabled: false
