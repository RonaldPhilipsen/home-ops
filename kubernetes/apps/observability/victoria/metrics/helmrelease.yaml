---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-k8s-stack
  namespace: observability
spec:
  interval: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.97.0
      url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      cluster:
        # -- K8s cluster domain suffix, uses for building storage pods' FQDN. Details are [here](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/)
        dnsDomain: cluster.local.
    fullnameOverride: vmetrics

    victoria-metrics-operator:
      enabled: true
      crds:
        # -- CRDs are provisioned by this chart (plain) and kept up to date
        #    by the pre-install/pre-upgrade upgrade job.
        upgrade:
          enabled: true

    defaultDashboards:
      enabled: true
      grafanaOperator:
        enabled: true

    defaultRules:
      create: true

    alertmanager:
      enabled: true
      spec:
        disableNamespaceMatcher: true
        configSecret: alertmanager-config
        # Externally reachable base URL used in notification links (must match the HTTPRoute hostname)
        externalURL: "https://alertmanager.rphilipsen.nl"
        # Persist silences and notification state (emptyDir by default loses them on restart)
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: local-hostpath
              resources:
                requests:
                  storage: 1Gi
        # prom/alertmanager runs as nobody (65534); fsGroup makes the PVC writable
        securityContext:
          fsGroup: 65534

    vmalert:
      enabled: true
      spec:
        # certificate for the HTTPS listener, at /etc/vm/secrets/vmalert-tls/
        secrets:
          - vmalert-tls
        extraArgs:
          # HTTPS listener next to HTTP (tls.yaml); "false,true" keeps the
          # primary port, probes and chart URLs on HTTP
          httpListenAddr: ":8080,:18080"
          tls: "false,true"
          tlsCertFile: ",/etc/vm/secrets/vmalert-tls/tls.crt"
          tlsKeyFile: ",/etc/vm/secrets/vmalert-tls/tls.key"
          # -- used to build the 'source' link in alertmanager alerts;
          #    must match the vmalert HTTPRoute hostname
          external.url: "https://vmalert.rphilipsen.nl"
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: kube-system
        hostnames: ["vmalert.rphilipsen.nl"]

    grafana:
      enabled: false

    vmsingle:
      enabled: true
      spec:
        # certificate for the HTTPS listener, at /etc/vm/secrets/vmsingle-tls/
        secrets:
          - vmsingle-tls
        extraArgs:
          # HTTPS listener next to HTTP (tls.yaml); "false,true" keeps the
          # primary port, probes and chart URLs on HTTP
          httpListenAddr: ":8428,:18428"
          tls: "false,true"
          tlsCertFile: ",/etc/vm/secrets/vmsingle-tls/tls.crt"
          tlsKeyFile: ",/etc/vm/secrets/vmsingle-tls/tls.key"
          maxLabelsPerTimeseries: "40"
          search.maxUniqueTimeseries: "600000"
          search.minStalenessInterval: 5m
        retentionPeriod: "6w"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 110Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 2000
          runAsGroup: 2000
          fsGroup: 2000
          fsGroupChangePolicy: Always
          seccompProfile:
            type: RuntimeDefault
        # persistentVolume:
        #   enabled: true
        #   storageClassName: local-hostpath
        #   size: 110Gi
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: kube-system
        hostnames: ["vmsingle.rphilipsen.nl"]

    vlsingle:
      enabled: true
      spec:
        # certificate for the HTTPS listener, at /etc/vm/secrets/vlsingle-tls/
        secrets:
          - vlsingle-tls
        port: "9428"
        retentionPeriod: "1"
        terminationGracePeriodSeconds: 60
        image:
          repository: victoriametrics/victoria-logs
          tag: v1.53.0
        extraArgs:
          # HTTPS listener next to HTTP (tls.yaml); "false,true" keeps the
          # primary port, probes and chart URLs on HTTP
          httpListenAddr: ":9428,:19428"
          tls: "false,true"
          tlsCertFile: ",/etc/vm/secrets/vlsingle-tls/tls.crt"
          tlsKeyFile: ",/etc/vm/secrets/vlsingle-tls/tls.key"
          envflag.enable: "true"
          envflag.prefix: VM_
          loggerFormat: json
          http.shutdownDelay: 15s
          retention.maxDiskUsagePercent: "80"
        # -- No operator-managed PVC: data continues on the existing vmsingle-vlogs PVC
        storage: null
        storageDataPath: /storage
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: vmsingle-vlogs
        volumeMounts:
          - name: data
            mountPath: /storage
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 30m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 2000
          seccompProfile:
            type: RuntimeDefault
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: kube-system
        hostnames: ["vlogs.rphilipsen.nl"]
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /

    vtsingle:
      enabled: true
      spec:
        # certificate for the HTTPS listener, at /etc/vm/secrets/vtsingle-tls/
        secrets:
          - vtsingle-tls
        port: "10428"
        retentionPeriod: "1"
        terminationGracePeriodSeconds: 60
        image:
          repository: victoriametrics/victoria-traces
          tag: v0.13.0
        extraArgs:
          # HTTPS listener next to HTTP (tls.yaml); "false,true" keeps the
          # primary port, probes and chart URLs on HTTP
          httpListenAddr: ":10428,:20428"
          tls: "false,true"
          tlsCertFile: ",/etc/vm/secrets/vtsingle-tls/tls.crt"
          tlsKeyFile: ",/etc/vm/secrets/vtsingle-tls/tls.key"
          envflag.enable: "true"
          envflag.prefix: VM_
          loggerFormat: json
          http.shutdownDelay: 15s
          retention.maxDiskUsagePercent: "80"
        # -- No operator-managed PVC: data continues on the existing traces StatefulSet PVC
        storage: null
        storageDataPath: /storage
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: server-volume-victoria-traces-server-0
        volumeMounts:
          - name: data
            mountPath: /storage
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 30m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 2000
          seccompProfile:
            type: RuntimeDefault
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: kube-system
        hostnames: ["vtraces.rphilipsen.nl"]

    internal:
      vmauth:
        spec:
          # certificate for the HTTPS listener, at /etc/vm/secrets/vmauth-tls/
          secrets:
            - vmauth-tls
          extraArgs:
            # HTTPS listener next to HTTP (tls.yaml); "false,true" keeps the
            # primary port, probes and chart URLs on HTTP
            httpListenAddr: ":8427,:18427"
            tls: "false,true"
            tlsCertFile: ",/etc/vm/secrets/vmauth-tls/tls.crt"
            tlsKeyFile: ",/etc/vm/secrets/vmauth-tls/tls.key"
    vmagent:
      enabled: true
      spec:
        # certificate for the HTTPS listener, at /etc/vm/secrets/vmagent-tls/
        secrets:
          - vmagent-tls
        extraArgs:
          # HTTPS listener next to HTTP (tls.yaml); "false,true" keeps the
          # primary port, probes and chart URLs on HTTP
          httpListenAddr: ":8429,:18429"
          tls: "false,true"
          tlsCertFile: ",/etc/vm/secrets/vmagent-tls/tls.crt"
          tlsKeyFile: ",/etc/vm/secrets/vmagent-tls/tls.key"
        resources:
          limits:
            memory: 1Gi
            cpu: 1
          requests:
            cpu: 150m
        selectAllByDefault: true
        scrapeInterval: 20s
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: kube-system
        hostnames: ["vmagent.rphilipsen.nl"]

    defaultDatasources:
      grafanaOperator:
        # -- Create datasources as CRDs (requires grafana-operator to be installed)
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: true

    prometheus-node-exporter:
      enabled: true

    kube-state-metrics:
      enabled: true

    kubelet:
      enabled: true

    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              max_scrape_size: 64MiB
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes

    kubeControllerManager:
      enabled: true
      service:
        selector:
          component: kube-apiserver # Selects controller node IPs
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeEtcd:
      enabled: true
      service:
        selector:
          component: kube-apiserver # Selects controller node IPs
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - scheme: http

    kubeScheduler:
      enabled: false

    kubeProxy:
      enabled: false

    coreDns:
      enabled: true
