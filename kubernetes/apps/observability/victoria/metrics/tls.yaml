---
# The gateway connects to the vmsingle-vmetrics-tls HTTPS port and verifies it against the
# internal CA (ConfigMap internal-ca).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/backendtlspolicy_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: vmsingle-vmetrics-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: vmsingle-vmetrics-tls
      sectionName: https
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: internal-ca
    hostname: vmsingle-vmetrics-tls.observability.svc.cluster.local
---
