---
# Backend TLS for the VictoriaMetrics stack (stage 1 of the HTTPS move).
# Each component listens on HTTPS on an extra port next to its HTTP port
# (extraArgs httpListenAddr/tls lists in helmrelease.yaml). VictoriaMetrics
# re-reads the certificate every second, so renewal needs no restart. The
# <name>-tls Services expose the HTTPS ports; their names are in the
# certificates. Clients move to them one by one, then HTTP is limited to the
# kubelet probes and the local config reloaders.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vmsingle-tls
spec:
  secretName: vmsingle-tls
  dnsNames:
    - vmsingle-vmetrics-tls.observability.svc.cluster.local
    - vmsingle-vmetrics-tls.observability.svc
    - vmsingle-vmetrics-tls.observability
  duration: 2160h # 90d
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: internal-ca
---
apiVersion: v1
kind: Service
metadata:
  name: vmsingle-vmetrics-tls
spec:
  selector:
    app.kubernetes.io/name: vmsingle
    app.kubernetes.io/instance: vmetrics
  ports:
    - name: https
      port: 18428
      targetPort: 18428
      protocol: TCP
---
