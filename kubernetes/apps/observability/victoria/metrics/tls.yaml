# Self-scrape of vmalertmanager-vmetrics over HTTPS, verified against the internal CA
# (serverName: the target is a pod IP). Replaces the operator's HTTP
# self-scrape (disableSelfServiceScrape in helmrelease.yaml); job keeps its
