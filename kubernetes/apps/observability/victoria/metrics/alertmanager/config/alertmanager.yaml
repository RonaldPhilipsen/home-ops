route:
  receiver: email
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: "null"
      matchers:
        - alertname = "InfoInhibitor"

inhibit_rules:
  - source_matchers:
      - alertname = "InfoInhibitor"
    target_matchers:
      - severity = "info"
    equal:
      - namespace

receivers:
  - name: "null"
  - name: email
    email_configs:
      - to: k8s@rphilipsen.nl
        from: "{{ .SMTP_USERNAME }}"
        smarthost: "{{ .SMTP_HOST }}:{{ .SMTP_PORT }}"
        auth_username: "{{ .SMTP_USERNAME }}"
        auth_password: "{{ .SMTP_PASSWORD }}"
        require_tls: true
        force_implicit_tls: false
        send_resolved: true
