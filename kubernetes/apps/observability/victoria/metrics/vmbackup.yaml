---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/cronjob.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vmbackup
  namespace: observability
spec:
  # -- daily full backup of vmsingle to the vm-backup Garage bucket,
  #    similar to the barman-cloud ScheduledBackup for the CNPG cluster.
  #    vmbackup is the OSS tool (no enterprise license needed); retention is
  #    enforced by the 17d lifecycle expiration policy on the bucket.
  schedule: "@daily"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          # vmsingle's data (and the snapshots vmbackup reads) live on the
          # RWO local-hostpath PVC vmsingle-vmetrics, so the job must run on
          # the same node as vmsingle.
          nodeSelector:
            kubernetes.io/hostname: k8s-neo-alpha
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: vmbackup
              # renovate: image=victoriametrics/vmbackup
              image: victoriametrics/vmbackup:v1.155.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -c
                - |
                  set -e
                  # Back up a consistent snapshot of the vmsingle storage to the
                  # vm-backup bucket. vmbackup creates the snapshot itself
                  # (-snapshot.createURL) and deletes it again after the upload
                  # (-snapshot.deleteURL is derived from the create URL).
                  # Note: with a custom S3 endpoint the -dst URL carries only the
                  # bucket name; the host comes from -customS3Endpoint.
                  /vmbackup-prod \
                    -dst=s3://vm-backup/vmsingle \
                    -credsFilePath=/creds/credentials \
                    -customS3Endpoint=https://s3.rphilipsen.nl \
                    -storageDataPath=/victoria-metrics-data \
                    -snapshot.createURL=http://vmsingle-vmetrics:8428/snapshot/create \
                    -concurrency=4
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: creds
                  mountPath: /creds
                  readOnly: true
                # vmsingle's data dir; vmbackup reads the snapshot it created
                # from <storageDataPath>/snapshots. Read-only: vmsingle is the
                # only writer.
                - name: vmsingle-data
                  mountPath: /victoria-metrics-data
                  readOnly: true
          volumes:
            - name: creds
              secret:
                secretName: vmbackup-credentials
            - name: vmsingle-data
              persistentVolumeClaim:
                claimName: vmsingle-vmetrics
                readOnly: true
