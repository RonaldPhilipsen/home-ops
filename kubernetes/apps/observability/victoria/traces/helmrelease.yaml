---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-traces
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.1.12
      url: oci://ghcr.io/victoriametrics/helm-charts/victoria-traces-single
  interval: 1h
  values:
    fullnameOverride: *app
    global:
      image:
        registry: quay.io
    server:
      retentionMaxDiskUsagePercent: 80
      persistentVolume:
        enabled: true
        # existingClaim: *app
        storageClassName: "local-hostpath"
        size: "20Gi"
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      route:
        enabled: true
        hostnames:
          - "vtraces.rphilipsen.nl"
        parentRefs:
          - name: internal
            namespace: kube-system
      serviceMonitor:
        enabled: true
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 30m
          memory: 512Mi
