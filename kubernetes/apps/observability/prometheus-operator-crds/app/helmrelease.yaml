apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 33.0.2
        digest: sha256:d327bd0fc1c77b62e481791650ef6fcfff9982646bcaca4cd2483c447630fe77
      url: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
