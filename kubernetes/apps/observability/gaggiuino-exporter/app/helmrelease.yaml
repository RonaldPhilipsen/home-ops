---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gaggiuino-exporter
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      gaggiuino-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/ronaldphilipsen/gaggiuino-exporter
              tag: v1.3.6@sha256:c3caa821c8955f45f0e548b05c9e1cb7d9fc50a6193c27c6936a880a0c3fe90a
            env:
              GAGGIUINO_BASE_URL: http://172.16.10.32:80
              OTLP_ENABLED: "true"
              OTLP_ENDPOINT: "https://vmsingle-vmetrics-tls.observability.svc.cluster.local:18428/opentelemetry/v1/metrics"
              # public CAs + internal CA (ConfigMap internal-ca-bundle), for the
              # HTTPS OTLP endpoint
              SSL_CERT_FILE: /etc/internal-ca-bundle/ca-certificates.crt
              OTLP_INTERVAL: "1s"
              OTLP_TIMEOUT: "0.5s"
              # DEBUG: "true"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 15m
              limits:
                memory: 120M
    persistence:
      internal-ca-bundle:
        type: configMap
        name: internal-ca-bundle
        globalMounts:
          - path: /etc/internal-ca-bundle
            readOnly: true
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9995
    # serviceMonitor:
    #   app:
    #     serviceName: *app
    #     endpoints:
    #       - port: http
    #         scheme: http
    #         path: /metrics
    #         interval: 1s
    #         scrapeTimeout: 1s
