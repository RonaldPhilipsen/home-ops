---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omada-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: omada-exporter-secret
  data:
    - secretKey: OMADA_BASE_URL
      remoteRef:
        key: omada
        property: omada_base_url
    - secretKey: OMADA_OMADAC_ID
      remoteRef:
        key: omada
        property: omada_c_id
    - secretKey: OMADA_CLIENT_ID
      remoteRef:
        key: omada
        property: omada_client_id
    - secretKey: OMADA_CLIENT_SECRET
      remoteRef:
        key: omada
        property: omada_client_secret
