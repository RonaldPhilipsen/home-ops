---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-ebpf
spec:
  interval: 1h
  dependsOn:
    - name: pyroscope
  chart:
    spec:
      chart: alloy
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      create: false
    alloy:
      configMap:
        create: false
        name: alloy-ebpf-config
        key: config.alloy
      enableReporting: false
      # The eBPF profiler loads BPF programs and reads the memory maps of every
      # process on the node, so it needs root, privileged mode and the host PID namespace.
      securityContext:
        privileged: true
        runAsGroup: 0
        runAsUser: 0
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
    controller:
      type: daemonset
      hostPID: true
      tolerations:
        - operator: Exists
