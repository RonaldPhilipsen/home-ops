---
# Random values generated in-cluster once (refreshInterval "0"), so they
# are not in git or 1Password. 32 characters: oauth2-proxy needs a cookie
# secret of 16, 24 or 32 bytes.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-webui
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# OIDC client secret, shared with Authelia. Authelia reads this secret through
# its hermes-webui-ai SecretStore, which the Role below allows.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-webui-oidc
spec:
  refreshInterval: "0"
  target:
    name: hermes-webui-oidc
    template:
      engineVersion: v2
      data:
        HERMES_WEBUI_OAUTH_CLIENT_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-webui
---
# oauth2-proxy session cookie encryption key. Not shared with Authelia.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-webui-cookie
spec:
  refreshInterval: "0"
  target:
    name: hermes-webui-cookie
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-webui
---
# Lets Authelia's SecretStore hermes-webui-ai (namespace security) read
# this one secret for its client list.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.v1/role.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authelia-hermes-webui-oidc-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["hermes-webui-oidc"]
    verbs: ["get"]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.v1/rolebinding.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authelia-hermes-webui-oidc-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authelia-hermes-webui-oidc-reader
subjects:
  - kind: ServiceAccount
    name: authelia-secret-reader
    namespace: security
