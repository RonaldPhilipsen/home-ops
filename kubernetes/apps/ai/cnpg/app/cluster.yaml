---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-memini
  annotations:
    # required for seamless bootstrap: https://github.com/cloudnative-pg/cloudnative-pg/issues/5778#issuecomment-2783417464
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  # vectorchord (vchord) image, same as immich-postgres
  # renovate: datasource=docker depName=ghcr.io/tensorchord/cloudnative-vectorchord
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18-1.1.1
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: false
    nodeSelector:
      kubernetes.io/hostname: k8s-neo-alpha
  storage:
    size: 5Gi
    storageClass: local-hostpath
    resizeInUseVolumes: True
  superuserSecret:
    name: memini-cnpg-superuser
  postgresql:
    # vchord (VectorChord) must be preloaded; the tensorchord image bundles it
    shared_preload_libraries:
      - vchord.so
  bootstrap:
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
  managed:
    roles:
      - name: memini
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: memini-db-credentials
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
