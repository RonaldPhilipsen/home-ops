---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-memini
  annotations:
    # required for seamless bootstrap: https://github.com/cloudnative-pg/cloudnative-pg/issues/5778#issuecomment-2783417464
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  # vectorchord (vchord) image, same as immich-postgres
  # renovate: datasource=docker depName=ghcr.io/tensorchord/cloudnative-vectorchord
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18-1.1.1
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: false
    nodeSelector:
      kubernetes.io/hostname: k8s-neo-alpha
  storage:
    size: 5Gi
    storageClass: local-hostpath
    resizeInUseVolumes: True
  superuserSecret:
    name: memini-cnpg-superuser
  certificates:
    # Combined pg-memini CA + SPIRE CA (kept current by the spire-ca-bridge
    # CronJob in kubernetes/apps/database/cloudnative-pg/cluster/ca-bridge.yaml)
    clientCASecret: pg-memini-spiffe-client-ca
  postgresql:
    # vchord (VectorChord) must be preloaded; the tensorchord image bundles it
    shared_preload_libraries:
      - vchord.so
    # SPIFFE cert auth for memini (user-defined section: precedes the
    # default scram catch-all). SVID CN = role name.
    pg_hba:
      - hostssl all memini all cert
      - hostnossl all memini all reject
  bootstrap:
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
  managed:
    roles:
      # memini authenticates with its SPIFFE SVID (pg_hba "cert", CN=memini).
      # disablePassword clears the old password in the database.
      - name: memini
        login: true
        superuser: false
        createdb: false
        disablePassword: true
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
