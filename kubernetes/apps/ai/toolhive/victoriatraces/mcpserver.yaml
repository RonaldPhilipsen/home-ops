---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: victoriatraces
spec:
  image: ghcr.io/victoriametrics-community/mcp-victoriatraces:v1.5.0
  transport: stdio
  groupRef:
    name: ai-tools
  env:
    # public CAs + internal CA (ConfigMap internal-ca-bundle, mounted below)
    # for the HTTPS backend; Go reads SSL_CERT_FILE
    - name: SSL_CERT_FILE
      value: /etc/internal-ca-bundle/ca-certificates.crt
    # In-cluster VictoriaTraces endpoint; no auth required.
    - name: VT_INSTANCE_ENTRYPOINT
      value: https://vtsingle-vmetrics-tls.observability.svc.cluster.local:20428
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      volumes:
        - name: internal-ca-bundle
          configMap:
            name: internal-ca-bundle
      containers:
        - name: mcp
          volumeMounts:
            - name: internal-ca-bundle
              mountPath: /etc/internal-ca-bundle
              readOnly: true
