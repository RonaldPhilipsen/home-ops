---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: ha-mcp
spec:
  groupRef:
    name: ai-tools
  # ha-mcp runs inside Home Assistant; the secret path is the credential.
  remoteUrl: ${HA_MCP_URL}
  transport: streamable-http
  # hass.rphilipsen.nl resolves to a LAN address.
  allowPrivateEndpoint: true
