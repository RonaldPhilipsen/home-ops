---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-ha-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: toolhive-ha-mcp
    creationPolicy: Owner
  data:
    # Full secret URL of the ha-mcp server that runs in Home Assistant,
    # e.g. http://hass.rphilipsen.nl:9584/private_<secret>
    - secretKey: HA_MCP_URL
      remoteRef:
        key: home-assistant
        property: HA_MCP_URL
