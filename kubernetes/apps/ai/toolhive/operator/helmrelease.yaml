---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 0.58.0
      url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: toolhive-operator
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --zap-log-level=warn
  values:
    operator:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      gc:
        gomemlimit: 450MiB
        gogc: 75
