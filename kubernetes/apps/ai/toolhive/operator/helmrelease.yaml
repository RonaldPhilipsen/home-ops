---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 0.70.0
        digest: sha256:9321ecbc8e45c947a29ffbb495a4da164570d0aae51c3a49911179f89a1e1eaf
      url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
  interval: 30m
  values:
    operator:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      gc:
        gomemlimit: 450MiB
        gogc: 75
