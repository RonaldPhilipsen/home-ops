---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: victoriametrics
spec:
  image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.120.1
  transport: stdio
  groupRef:
    name: ai-tools
  env:
    # public CAs + internal CA (ConfigMap internal-ca-bundle, mounted below)
    # for the HTTPS backend; Go reads SSL_CERT_FILE
    - name: SSL_CERT_FILE
      value: /etc/internal-ca-bundle/ca-certificates.crt
    # In-cluster VictoriaMetrics endpoint; no auth required.
    - name: VM_INSTANCE_ENTRYPOINT
      value: https://vmsingle-vmetrics-tls.observability.svc.cluster.local:18428
    - name: VM_INSTANCE_TYPE
      value: single
    # The embedded docs corpus is exposed as thousands of MCP resources, which
    # makes the ToolHive virtual server's resources/list health check time out.
    # Disabling resources keeps the documentation search tool working.
    - name: MCP_DISABLE_RESOURCES
      value: "true"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      volumes:
        - name: internal-ca-bundle
          configMap:
            name: internal-ca-bundle
      containers:
        - name: mcp
          volumeMounts:
            - name: internal-ca-bundle
              mountPath: /etc/internal-ca-bundle
              readOnly: true
