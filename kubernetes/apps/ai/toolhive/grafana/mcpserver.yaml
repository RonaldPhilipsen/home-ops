---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
spec:
  image: grafana/mcp-grafana:2.1.1
  transport: stdio
  groupRef:
    name: ai-tools
  args:
    - -t
    - stdio
    - --disable-write
  env:
    - name: GRAFANA_URL
      value: https://grafana.rphilipsen.nl/
  secrets:
    - name: grafana-mcp
      key: token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
