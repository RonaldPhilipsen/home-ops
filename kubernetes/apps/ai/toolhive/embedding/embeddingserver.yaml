---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/embeddingserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: EmbeddingServer
metadata:
  name: memini-embedding
spec:
  model: Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
  imagePullPolicy: IfNotPresent
  port: 8080
  replicas: 1
  args:
    - --pooling
    - last-token
    - --served-model-name
    - qwen3-embedding-0.6b
  modelCache:
    enabled: true
    size: 10Gi
    storageClassName: local-hostpath
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi
  podTemplateSpec:
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-neo-alpha
