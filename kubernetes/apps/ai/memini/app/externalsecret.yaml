---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api_key: "{{ .api_key }}"
        authorization: "Bearer {{ .api_key }}"
        # local db-bridge sidecar (SPIFFE SVID, CN=memini) on loopback; no
        # password. sslmode=disable is correct: TLS starts at the bridge.
        dsn: "postgresql://memini@127.0.0.1:5432/memini?sslmode=disable"
  dataFrom:
    - extract:
        key: memini
