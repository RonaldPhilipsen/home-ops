---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v4.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name memini
  namespace: ai
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: v0.7.37
      url: oci://ghcr.io/eleboucher/charts/memini
  upgrade:
    force: true
  # app-template's schema allows neither pod.volumes nor container
  # volumeMounts, so the db-bridge volumes and their mounts are added here
  # (strategic merge: containers merge by name, volumes by name).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: memini
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: memini
              spec:
                template:
                  spec:
                    volumes:
                      # SPIRE agent Workload API socket
                      - name: spiffe
                        csi:
                          driver: csi.spiffe.io
                          readOnly: true
                      # SVID files written by spiffe-helper, read by the bridge
                      - name: svid
                        emptyDir: {}
                      # pg-memini server CA: same namespace, so mount the
                      # cluster CA secret directly, but only its ca.crt
                      - name: cnpg-ca
                        secret:
                          secretName: pg-memini-ca
                          items:
                            - key: ca.crt
                              path: ca.crt
                    containers:
                      - name: db-bridge
                        volumeMounts:
                          - name: spiffe
                            mountPath: /run/spiffe
                            readOnly: true
                          - name: svid
                            mountPath: /spiffe
                          - name: cnpg-ca
                            mountPath: /cnpg-ca
                            readOnly: true
  values:
    global:
      fullnameOverride: *name
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: k8s-neo-alpha
    controllers:
      main:
        type: deployment
        replicas: 1
        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        containers:
          main:
            image:
              # chart default points at the developer's private registry
              repository: ghcr.io/eleboucher/memini
              tag: "0.7.39"
              digest: ""
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
            env:
              MEMINI_BACKEND: postgres
              MEMINI_LOG_FORMAT: json
              MEMINI_DEMOTE_AFTER: 1440h
              MEMINI_TOMBSTONE_TTL: 720h
              MEMINI_EMBED_BASE_URL: http://memini-embed.ai.svc:8000/v1
              MEMINI_EMBED_MODEL: qwen3-embedding-0.6b
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_QUERY_PREFIX: "Instruct: Given a user message, retrieve relevant past memories\nQuery: "
              MEMINI_RECALL_EMBED_TIMEOUT: "10s"
              MEMINI_EMBED_MAX_CONCURRENCY: "2"
              MEMINI_RERANK: http://memini-rerank.ai.svc:8000/v1
              MEMINI_RERANK_MODEL: qwen3-reranker-0.6b
              MEMINI_RERANK_MAX_DOC_CHARS: "4000"
              MEMINI_POSTGRES_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: dsn
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: api_key
          # SPIFFE-aware Postgres bridge: spiffe-helper fetches/rotates the
          # SVID (CN=memini); the bridge serves the app on loopback and presents
          # the SVID to pg-memini-rw.ai.svc:5432 (pg_hba "cert"). No DB password involved.
          # (volumeMounts are added by the postRenderer: the chart schema does not
          # allow them in values)
          db-bridge:
            image:
              repository: ghcr.io/ronaldphilipsen/db-bridge
              tag: 1.3.0@sha256:a56fc5a98e33f767227541f99c441728b42a08bee4a1b940c1a93fcb344fa1f0
            env:
              DB_BRIDGE_UPSTREAM: pg-memini-rw.ai.svc:5432
            probes:
              # the bridge listens on loopback only, so a kubelet tcpSocket probe
              # (which dials the pod IP) can never work; ask the binary
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    persistence:
      data:
        enabled: false
    serviceMonitor:
      main:
        enabled: true
    route:
      main:
        enabled: true
        labels:
          expose: public
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        hostnames:
          - memini.rphilipsen.nl
      # Split-horizon: same host, internal gateway serves the UI on-LAN.
      ui:
        enabled: true
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        hostnames:
          - memini-ui.rphilipsen.nl
