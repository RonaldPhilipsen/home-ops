---
# Grants the database-namespace CA bridge service account read + exec access
# to the spire server pod, so it can fetch the current X.509 bundle (PEM)
# via `spire-server bundle show`.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.v1/role.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spiffe-ca-bridge-bundle-reader
  namespace: spiffe
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["spire-server-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["spire-server-0"]
    verbs: ["create"]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.v1/rolebinding.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spiffe-ca-bridge-bundle-reader
  namespace: spiffe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spiffe-ca-bridge-bundle-reader
subjects:
  - kind: ServiceAccount
    name: spiffe-ca-bridge
    namespace: database
