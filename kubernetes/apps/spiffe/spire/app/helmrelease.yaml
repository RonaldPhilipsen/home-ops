---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spiffe
  labels:
    kustomize.toolkit.fluxcd.io/substitute: "disabled"
spec:
  interval: 30m
  dependsOn:
    - name: spire-crds
  chart:
    spec:
      chart: spire
      version: 0.30.4
      sourceRef:
        kind: HelmRepository
        name: spiffe-charts-hardened
        namespace: spiffe
      interval: 30m
  maxHistory: 2
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      spire:
        trustDomain: spiffe.rphilipsen.nl
        clusterName: kubernetes
        persistence:
          storageClass: nfs-provision
    spire-server:
      bundlePublisher:
        k8sConfigMap:
          # PEM so the CNPG CA bridge can concatenate it with postgres-ca.crt
          format: pem
    spiffe-oidc-discovery-provider:
      enabled: false
