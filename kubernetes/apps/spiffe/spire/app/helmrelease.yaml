---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spiffe
  labels:
    kustomize.toolkit.fluxcd.io/substitute: "disabled"
spec:
  interval: 30m
  dependsOn:
    - name: spire-crds
  chart:
    spec:
      chart: spire
      version: 0.30.4
      sourceRef:
        kind: HelmRepository
        name: spiffe-charts-hardened
        namespace: spiffe
      interval: 30m
  maxHistory: 2
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      spire:
        trustDomain: spiffe.rphilipsen.nl
        clusterName: kubernetes
        caSubject:
          country: NL
          organization: rphilipsen
          commonName: spiffe.rphilipsen.nl
        persistence:
          # local-hostpath (same as CNPG data): nfs-provision's NFS server does
          # not export newly created subdirectories, so the PVC mount fails.
          # Single-replica server pinned to one node — accepted for a homelab.
          storageClass: local-hostpath
    spiffe-oidc-discovery-provider:
      enabled: false
