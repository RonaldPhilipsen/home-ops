---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire-crds
  namespace: spiffe
  labels:
    kustomize.toolkit.fluxcd.io/substitute: "disabled"
spec:
  interval: 1h
  chart:
    spec:
      chart: spire-crds
      version: 0.6.1
      sourceRef:
        kind: HelmRepository
        name: spiffe-charts-hardened
        namespace: spiffe
      interval: 1h
  maxHistory: 2
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
