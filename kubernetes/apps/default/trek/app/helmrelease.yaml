---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trek
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  values:
    controllers:
      trek:
        type: deployment
        # TREK is a single-writer SQLite app on a RWO volume; RollingUpdate would
        # double-write travel.db, so tear down the old pod before the new one starts.
        strategy: Recreate
        containers:
          app:
            image:
              repository: mauriceboe/trek
              tag: 5.1.0
            # Use the local entrypoint variant (ConfigMap trek-entrypoint)
            # instead of the image's /usr/local/bin/trek-entrypoint: the
            # upstream chown forces group 1000 on the data dirs, which breaks
            # the kopiur backup mover (uid/gid 2000). Keep dumb-init as the
            # entrypoint (signal handling), override only the CMD.
            command: ["dumb-init", "--"]
            args: ["/etc/trek/entrypoint.sh"]
            env:
              - name: TZ
                value: Europe/Amsterdam
              - name: APP_URL
                value: https://trek.rphilipsen.nl
              - name: ALLOWED_ORIGINS
                value: https://trek.rphilipsen.nl
              - name: OIDC_ISSUER
                value: https://auth.rphilipsen.nl
              - name: OIDC_SCOPE
                value: openid profile email groups
              - name: OIDC_ADMIN_VALUE
                value: trek_admin
              - name: OIDC_ONLY
                value: "true"
              - name: OIDC_DISCOVERY_URL
                value: http://127.0.0.1:8080/.well-known/openid-configuration
            envFrom:
              - secretRef:
                  name: trek
              - secretRef:
                  name: trek-oidc
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/ready
                    port: 3000
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
          oidc-proxy:
            image:
              repository: ghcr.io/nginxinc/nginx-unprivileged
              tag: "1.27.4"
              pullPolicy: IfNotPresent
            ports:
              - containerPort: 8080
            securityContext:
              runAsGroup: 2000
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        # The image entrypoint drops from root to its in-image `node` user
        # (uid 1000), so the pod must start as root.
        # Group 2000 is shared with the kopiur backup mover (runs as uid/gid 2000);
        # the hostpath dirs carry setgid, so app files are group 2000 and readable
        # by the mover (e.g. 644 1000:2000).
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        labels:
          expose: public
        hostnames: ["trek.rphilipsen.nl"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: 3000
    persistence:
      data:
        existingClaim: trek
        globalMounts:
          - path: /app/data
      uploads:
        existingClaim: trek-uploads
        globalMounts:
          - path: /app/uploads
      oidc-proxy-config:
        type: configMap
        name: trek-oidc-proxy
        globalMounts:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
          - path: /etc/nginx/oidc/openid-configuration.json
            subPath: openid-configuration.json
            readOnly: true
      entrypoint:
        type: configMap
        name: trek-entrypoint
        # executable: the container args exec this script directly
        defaultMode: 0755
        globalMounts:
          - path: /etc/trek
            subPath: entrypoint.sh
            readOnly: true
