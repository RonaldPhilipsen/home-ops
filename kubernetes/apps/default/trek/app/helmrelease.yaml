---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trek
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  values:
    controllers:
      trek:
        type: deployment
        # TREK is a single-writer SQLite app on a RWO volume; RollingUpdate would
        # double-write travel.db, so tear down the old pod before the new one starts.
        strategy: Recreate
        containers:
          app:
            image:
              repository: mauriceboe/trek
              tag: 5.0.0
            env:
              - name: TZ
                value: Europe/Amsterdam
              - name: APP_URL
                value: https://trek.rphilipsen.nl
              - name: ALLOWED_ORIGINS
                value: https://trek.rphilipsen.nl
            envFrom:
              - secretRef:
                  name: trek
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/ready
                    port: 3000
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        labels:
          expose: public
        hostnames: ["trek.rphilipsen.nl"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: 3000
    persistence:
      data:
        existingClaim: trek
        globalMounts:
          - path: /app/data
      uploads:
        existingClaim: trek-uploads
        globalMounts:
          - path: /app/uploads
