---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ./helmrelease.yaml
configMapGenerator:
  # The image's config.json with rphilipsen.nl as the only homeserver
  - name: sable-config
    files:
      - config.json=resources/config.json
generatorOptions:
  disableNameSuffixHash: true
