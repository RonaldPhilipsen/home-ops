---
# Backend TLS for nginx-static (served natively on 8443). Issued by the internal
# CA; nginx-static loads the PKCS#12 keystore at startup, and Reloader restarts
# it when cert-manager renews the secret. The keystore password is not a
# secret: the secret also holds the key in clear.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-static-tls
spec:
  secretName: nginx-static-tls
  dnsNames:
    - nginx-static.default.svc.cluster.local
    - nginx-static.default.svc
    - nginx-static.default
  duration: 2160h # 90d
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: internal-ca
---
# The gateway connects to nginx-static's TLS port and verifies the certificate
# against the internal CA (ConfigMap internal-ca from trust-manager; Cilium
# accepts only ConfigMap CA refs).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/backendtlspolicy_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: nginx-static
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: nginx-static
      sectionName: https
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: internal-ca
    hostname: nginx-static.default.svc.cluster.local
