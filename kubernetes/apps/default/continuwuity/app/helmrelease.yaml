---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v4.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app continuwuity
  namespace: default
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      continuwuity:
        # restart on changes to conduit-configmap and the mounted secrets
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: forgejo.ellis.link/continuwuation/continuwuity
              tag: v26.9.3-maxperf@sha256:0226cd42554761d5845df0cee5f525b6d18573bbbd6d34dc50d8c5aeff70911d
            env:
              TZ: "Europe/Amsterdam"
              CONDUWUIT_SERVER_NAME: rphilipsen.nl
              CONDUWUIT_ADDRESS:
                valueFrom:
                  fieldRef:
                    apiVersion: v1
                    fieldPath: status.podIP
              CONDUWUIT_PORT: &port 8443
              # native TLS on the same port (tls.yaml): HTTPS only
              CONDUWUIT_TLS__CERTS: /tls/tls.crt
              CONDUWUIT_TLS__KEY: /tls/tls.key
              CONDUWUIT_TLS__DUAL_PROTOCOL: "false"
              CONDUWUIT_CONFIG: "/config/conduit.toml"
              CONDUWUIT_WELL_KNOWN__CLIENT: "https://matrix.rphilipsen.nl"
              CONDUWUIT_WELL_KNOWN__SERVER: "matrix.rphilipsen.nl:443"
            envFrom:
              - secretRef:
                  name: continuwuity
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: continuwuity
        ports:
          https:
            port: *port

    route:
      app:
        labels:
          expose: public
        annotations:
          external-dns.kubernetes.io/external: "true"
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        hostnames:
          - &host matrix.rphilipsen.nl
      federation:
        labels:
          expose: public
        annotations:
          external-dns.kubernetes.io/external: "true"
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
          - name: external
            namespace: kube-system
            sectionName: https-apex
        hostnames:
          - rphilipsen.nl
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /_matrix
              - path:
                  type: PathPrefix
                  value: /_synapse
            backendRefs:
              - name: continuwuity
                port: *port
      well-known:
        labels:
          expose: public
        annotations:
          external-dns.kubernetes.io/external: "true"
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
          - name: external
            namespace: kube-system
            sectionName: https-apex
        hostnames:
          - rphilipsen.nl
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /.well-known/matrix/
            backendRefs:
              - name: continuwuity
                port: *port

    persistence:
      tls:
        type: secret
        name: continuwuity-tls
        defaultMode: 0440
        advancedMounts:
          continuwuity:
            app:
              - path: /tls
                readOnly: true
      data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: *app
      media:
        size: 5Gi
        accessMode: ReadWriteOnce
        storageClass: nfs-provision
        suffix: "media"
        retain: true
        globalMounts:
          - path: /data/media
      backups:
        size: 5Gi
        accessMode: ReadWriteOnce
        storageClass: nfs-provision
        suffix: "backups"
        globalMounts:
          - path: /backups
      config:
        type: configMap
        name: conduit-configmap
        globalMounts:
          - path: /config/conduit.toml
            subPath: conduit.toml
      oidc:
        type: secret
        name: continuwuity-oidc
        defaultMode: 0400
        advancedMounts:
          continuwuity:
            app:
              - path: /secrets/oidc-client-secret
                subPath: CONTINUWUITY_OAUTH_CLIENT_SECRET
                readOnly: true
