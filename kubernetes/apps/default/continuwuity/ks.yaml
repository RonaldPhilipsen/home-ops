---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app continuwuity
  namespace: &namespace default
spec:
  path: ./kubernetes/apps/default/continuwuity/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  components:
    - ../../../../components/kopiur/cold
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 8Gi
      NAMESPACE: *namespace
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
