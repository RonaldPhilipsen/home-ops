---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name omada-cert-sync-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OMADA_USER: "{{ .username }}"
        OMADA_PASS: "{{ .password }}"
  dataFrom:
    - extract:
        key: omada-cert-sync
