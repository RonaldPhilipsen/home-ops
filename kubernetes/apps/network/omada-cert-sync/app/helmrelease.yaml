---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omada-cert-sync
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  values:
    controllers:
      omada-cert-sync:
        type: cronjob
        cronjob:
          # The job exits without a login when the controller is current.
          schedule: "17 * * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 0
        pod:
          securityContext:
            fsGroup: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/ronaldphilipsen/omada-cert-sync
              tag: 0.1.0@sha256:1bfc9fbc912e79b69aa67ec9ad063d4685ac3a8ab6a8b20718f76de13fb0e116
            env:
              OMADA_URL: https://omada.rphilipsen.nl
            envFrom:
              - secretRef:
                  name: omada-cert-sync-secret
            resources:
              requests:
                cpu: 5m
                memory: 16M
              limits:
                memory: 64M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      tls:
        type: secret
        name: omada-controller-tls
        globalMounts:
          - path: /tls
            readOnly: true
