---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-dns-omada
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: victoria-traces
      inputName: DS_VTRACES
    - datasourceName: victoria-logs
      inputName: DS_VLOGS
  json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(omada_dns_changes_total[1h]))",
              "instant": false,
              "legendFormat": "__auto",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "DNS changes (1h)",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(omada_dns_errors_total[1h]))",
              "instant": false,
              "legendFormat": "__auto",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "DNS errors (1h)",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(http_server_request_duration_seconds_count[1h]))",
              "instant": false,
              "legendFormat": "__auto",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Webhook requests (1h)",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 4,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (span_name) (rate(traces_span_metrics_calls[5m]))",
              "instant": false,
              "legendFormat": "{{span_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Rate: requests per span (spanmetrics)",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 5,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (span_name) (rate(traces_span_metrics_calls{status_code=\"Error\"}[5m]))",
              "instant": false,
              "legendFormat": "{{span_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Errors per span (spanmetrics)",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "id": 6,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (le, span_name) (rate(traces_span_metrics_duration[5m])))",
              "instant": false,
              "legendFormat": "p50 {{span_name}}",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le, span_name) (rate(traces_span_metrics_duration[5m])))",
              "instant": false,
              "legendFormat": "p95 {{span_name}}",
              "range": true,
              "refId": "B"
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le, span_name) (rate(traces_span_metrics_duration[5m])))",
              "instant": false,
              "legendFormat": "p99 {{span_name}}",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Duration percentiles per span (spanmetrics)",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "id": 7,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds[5m])))",
              "instant": false,
              "legendFormat": "p50",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds[5m])))",
              "instant": false,
              "legendFormat": "p95",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Webhook request latency (otelhttp)",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 24 },
          "id": 8,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (omada_dns_operation) (rate(omada_dns_changes_total[5m]))",
              "instant": false,
              "legendFormat": "{{omada_dns_operation}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "DNS operations by type",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 24 },
          "id": 9,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (omada_dns_error) (rate(omada_dns_errors_total[5m]))",
              "instant": false,
              "legendFormat": "{{omada_dns_error}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "DNS errors by category",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 24 },
          "id": 10,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "omada_dns_entries",
              "instant": false,
              "legendFormat": "entries",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Managed Omada DNS entries",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "victoriametrics-logs-datasource", "uid": "${DS_VLOGS}" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 32 },
          "id": 11,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": false,
            "fontSize": 10,
            "hideZeros": false,
            "prependRowLabels": false,
            "showFullLogMessage": false,
            "showLabels": false,
            "showLiveTail": true,
            "showRealTimeLogCount": false,
            "showRowType": false,
            "showTime": true,
            "showType": false,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "victoriametrics-logs-datasource", "uid": "${DS_VLOGS}" },
              "query": "{k8s.namespace.name=\"network\", k8s.pod.name=~\"external-dns-omada.*\"}",
              "refId": "A"
            }
          ],
          "title": "Live logs (external-dns-omada)",
          "type": "logs"
        },
        {
          "datasource": { "type": "tempo", "uid": "${DS_VTRACES}" },
          "gridPos": { "h": 12, "w": 12, "x": 0, "y": 42 },
          "id": 12,
          "options": {
            "enableLogDetails": false,
            "enableMeasure": false,
            "prettifyTraces": false,
            "showHeaders": false,
            "showQuery": true,
            "showTraceGraph": false,
            "showTraceTimes": true,
            "showTracesCount": true,
            "sortDesc": true,
            "sortBy": "Timestamp"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "${DS_VTRACES}" },
              "query": "{resource_attr:service.name=\"external-dns-omada\"}",
              "queryType": "traceql",
              "refId": "A"
            }
          ],
          "title": "Traces",
          "type": "traces"
        },
        {
          "datasource": { "type": "tempo", "uid": "${DS_VTRACES}" },
          "gridPos": { "h": 12, "w": 12, "x": 12, "y": 42 },
          "id": 13,
          "options": {
            "enableLogDetails": false,
            "enableMeasure": false,
            "prettifyTraces": false,
            "showHeaders": false,
            "showQuery": true,
            "showTraceGraph": false,
            "showTraceTimes": true,
            "showTracesCount": true,
            "sortDesc": true,
            "sortBy": "Timestamp"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "${DS_VTRACES}" },
              "query": "{resource_attr:service.name=\"external-dns-omada\"} | spans: {status_code = \"2\"}",
              "queryType": "traceql",
              "refId": "A"
            }
          ],
          "title": "Errored traces",
          "type": "traces"
        }
      ],
      "preload": false,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["omada", "external-dns", "otel"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "External DNS Omada",
      "uid": "external-dns-omada",
      "version": 1,
      "weekStart": ""
    }
