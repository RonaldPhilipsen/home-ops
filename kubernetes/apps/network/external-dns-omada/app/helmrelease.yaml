---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-omada
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns
  values:
    fullnameOverride: *app
    # Stock external-dns image (chart 1.23.0 -> v0.23.0); the Omada provider
    # is provided by the webhook sidecar below, so no forked image is needed.
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/ronaldphilipsen/external-dns-omada
          # Bump when a new release is published.
          tag: v0.1.2
        env:
          - name: OMADA_SERVER
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-omada-secret
                key: OMADA_SERVER
          - name: OMADA_ID
            valueFrom:
              secretKeyRef:
                name: *secret
                key: OMADA_ID
          - name: OMADA_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: *secret
                key: OMADA_CLIENT_ID
          - name: OMADA_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: *secret
                key: OMADA_CLIENT_SECRET
          - name: OMADA_SITE_NAME
            valueFrom:
              secretKeyRef:
                name: *secret
                key: OMADA_SITE_NAME
          - name: OMADA_TLS_SKIP_VERIFY
            valueFrom:
              secretKeyRef:
                name: *secret
                key: OMADA_TLS_SKIP_VERIFY
          # Attach managed entries to these LAN networks only, so local
          # services stay invisible from the Guest network.
          - name: OMADA_NETWORKS
            value: "Default,IOT,K8s"
          # Kept in sync with domainFilters below; it is also negotiated
          # back to external-dns during webhook startup.
          - name: DOMAIN_FILTER
            value: "rphilipsen.nl"
          # Export OTLP traces and metrics to the gateway collector; the
          # collector's spanmetrics connector derives RED metrics from the
          # spans, and VictoriaMetrics/VictoriaTraces/VictoriaLogs serve
          # them to the omada-otel Grafana dashboard.
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://gateway-collector.observability.svc.cluster.local:4318"
          - name: OTEL_SERVICE_NAME
            value: "external-dns-omada"
    extraArgs:
      # Default already; stated explicitly because it binds the two
      # containers together.
      - --webhook-provider-url=http://localhost:8888
    triggerLoopOnEvent: true
    policy: upsert-only
    # The Omada controller cannot store the TXT records the txt registry
    # uses for ownership, so no plan update or delete would ever be
    # applied. Run without an ownership registry instead; the upsert-only
    # policy keeps manual entries safe.
    registry: noop
    sources:
      - "gateway-httproute"
      - "gateway-tcproute"
      - "gateway-udproute"
      - "service"
      - "crd"
    logLevel: info
    logFormat: text
    domainFilters:
      - rphilipsen.nl
    podAnnotations:
      # Restarts the pod (both containers) when the Omada credentials
      # change.
      secret.reloader.stakater.com/reload: external-dns-omada-secret
