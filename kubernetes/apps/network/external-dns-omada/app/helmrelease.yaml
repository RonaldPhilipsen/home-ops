---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-omada
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns
  values:
    fullnameOverride: *app
    image:
      repository: ghcr.io/ronaldphilipsen/external-dns-omada
      tag: v0.24.0-rc.3
    provider: omada
    env:
      - name: EXTERNAL_DNS_OMADA_SERVER
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-omada-secret
            key: EXTERNAL_DNS_OMADA_SERVER
      - name: EXTERNAL_DNS_OMADA_ID
        valueFrom:
          secretKeyRef:
            name: *secret
            key: EXTERNAL_DNS_OMADA_ID
      - name: EXTERNAL_DNS_OMADA_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: *secret
            key: EXTERNAL_DNS_OMADA_CLIENT_ID
      - name: EXTERNAL_DNS_OMADA_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: *secret
            key: EXTERNAL_DNS_OMADA_CLIENT_SECRET
      - name: EXTERNAL_DNS_OMADA_SITE_NAME
        valueFrom:
          secretKeyRef:
            name: *secret
            key: EXTERNAL_DNS_OMADA_SITE_NAME
      - name: EXTERNAL_DNS_OMADA_TLS_SKIP_VERIFY
        valueFrom:
          secretKeyRef:
            name: *secret
            key: EXTERNAL_DNS_OMADA_TLS_SKIP_VERIFY
      # Attach managed entries to these LAN networks only, so local
      # services stay invisible from the Guest network.
      - name: EXTERNAL_DNS_OMADA_NETWORKS
        value: "Default,IOT,K8s"
    extraArgs:
      - --metrics-address=:7979
    triggerLoopOnEvent: true
    policy: upsert-only
    sources:
      - "gateway-httproute"
      - "service"
      - "crd"
    logLevel: info
    logFormat: text
    domainFilters:
      - rphilipsen.nl
    podAnnotations:
      secret.reloader.stakater.com/reload: external-dns-omada-secret
