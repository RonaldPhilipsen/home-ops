---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name external-dns-omada-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        EXTERNAL_DNS_OMADA_SERVER: "https://192.168.0.2:443"
        EXTERNAL_DNS_OMADA_ID: "803d74060572a8ec2ecebe22591f1a89"
        EXTERNAL_DNS_OMADA_CLIENT_ID: "{{ .client_id }}"
        EXTERNAL_DNS_OMADA_CLIENT_SECRET: "{{ .client_secret }}"
        EXTERNAL_DNS_OMADA_SITE_NAME: "Home"
        EXTERNAL_DNS_OMADA_TLS_SKIP_VERIFY: "True"
  dataFrom:
    - extract:
        key: omada-dns
