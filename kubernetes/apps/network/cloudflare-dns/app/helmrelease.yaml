---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret cloudflare-dns-secret
            key: api-token
    # The public zone only carries the L7 CNAMEs to the tunnel. L4 (TCP/UDP)
    # names are A records to the (private) gateway IPs, so they live only in
    # the LAN (omada) instance via DNSEndpoints; the `crd` source is dropped
    # here, which also ends the 400-loop on the private omada A record. The
    # external.rphilipsen.nl tunnel CNAME becomes manually managed in CF.
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --gateway-name=external
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - "gateway-httproute"
    txtPrefix: "k8s-%{record_type}." # Required for managing root domains. See: https://github.com/kubernetes-sigs/external-dns/blob/82905488a8cc963393f623f9a8ba484a141e81dc/docs/registry/txt.md?plain=1#L8
    txtOwnerId: default
    domainFilters: ["rphilipsen.nl"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
