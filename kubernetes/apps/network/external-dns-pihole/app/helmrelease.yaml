---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-pihole
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 1.23.0
      url: oci://ghcr.io/home-operations/charts-mirror/external-dns
  values:
    fullnameOverride: *app
    provider: pihole
    env:
      - name: EXTERNAL_DNS_PIHOLE_SERVER
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-pihole-secret
            key: EXTERNAL_DNS_PIHOLE_SERVER
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: *secret
            key: EXTERNAL_DNS_PIHOLE_PASSWORD
      - name: EXTERNAL_DNS_PIHOLE_TLS_SKIP_VERIFY
        valueFrom:
          secretKeyRef:
            name: *secret
            key: EXTERNAL_DNS_PIHOLE_TLS_SKIP_VERIFY
      - name: EXTERNAL_DNS_PIHOLE_API_VERSION
        valueFrom:
          secretKeyRef:
            name: *secret
            key: EXTERNAL_DNS_PIHOLE_API_VERSION
    extraArgs:
      - --metrics-address=:7979
    triggerLoopOnEvent: true
    policy: upsert-only
    # `crd` publishes the L4 gateway A-records (see
    # external-dns-omada/app/dnsendpoint-l4.yaml) to this (stable) LAN
    # resolver; the omada server is best-effort and not guaranteed up.
    sources:
      - "gateway-httproute"
      - "gateway-tcproute"
      - "gateway-udproute"
      - "service"
      - "crd"
    logLevel: info
    logFormat: text
    domainFilters:
      - rphilipsen.nl
    podAnnotations:
      secret.reloader.stakater.com/reload: external-dns-pihole-secret
