---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: democratic-csi-local-path
  namespace: flux-system
spec:
  path: "kubernetes/apps/storage/democratic-csi/app"
  sourceRef:
    kind: GitRepository
    name: k8s-gitops-kubernetes
  interval: 10m
  prune: true
  wait: true
