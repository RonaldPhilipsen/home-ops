# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.10.16
      url: oci://ghcr.io/home-operations/charts/kopiur
  interval: 30m
  values:
    installScope: cluster
    monitoring:
      dashboards:
        enabled: true
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    webhook:
      tls:
        mode: self
