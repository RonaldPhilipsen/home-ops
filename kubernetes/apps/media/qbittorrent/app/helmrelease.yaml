---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
            env:
              TZ: "Europe/Amsterdam"
              QBT_WEBUI_PORT: &port 8080
              QBT_TORRENTING_PORT: &torrentPort 50413
              CROSS_SEED_ENABLED: false
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi
        # Enables HTTPS for the Web UI (tls.yaml) in qBittorrent.conf on every
        # start, so the setting lives in git: removes old HTTPS\ keys and
        # writes them under [WebUI]. On the very first boot the file is
        # created by the app itself.
        initContainers:
          webui-tls:
            image: *image
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                f=/config/qBittorrent/qBittorrent.conf
                [ -f "$f" ] || { echo "no $f yet (first boot)"; exit 0; }
                grep -q '^\[WebUI\]' "$f" || printf '\n[WebUI]\n' >> "$f"
                sed -i '/^HTTPS\\/d' "$f"
                sed -i '/^\[WebUI\]$/a HTTPS\\Enabled=true\nHTTPS\\CertificatePath=/tls/tls.crt\nHTTPS\\KeyPath=/tls/tls.key' "$f"
                sed -n '/^\[WebUI\]/,/^\[/p' "$f" | grep -E '^(\[WebUI\]|HTTPS)'
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 300
    service:
      app:
        controller: *app
        type: ClusterIP
        ports:
          https:
            port: *port
          bittorrent:
            enabled: true
            port: *torrentPort
            protocol: TCP
    route:
      app:
        hostnames: ["qb.rphilipsen.nl"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          # HTTPS backend; BackendTLSPolicy qbittorrent (tls.yaml) verifies it
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        existingClaim: *app
      tls:
        type: secret
        name: qbittorrent-tls
        defaultMode: 0440
        advancedMounts:
          qbittorrent:
            app:
              - path: /tls
                readOnly: true
      data:
        existingClaim: media-nfs
