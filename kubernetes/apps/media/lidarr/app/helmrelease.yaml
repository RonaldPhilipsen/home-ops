---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lidarr
  namespace: media
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  # app-template's schema allows neither pod.volumes nor container
  # volumeMounts, so the db-bridge volumes and their mounts are added here
  # (strategic merge: containers merge by name, volumes by name).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: lidarr
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: lidarr
              spec:
                template:
                  spec:
                    volumes:
                      # SPIRE agent Workload API socket
                      - name: spiffe
                        csi:
                          driver: csi.spiffe.io
                          readOnly: true
                      # SVID files written by spiffe-helper, read by the bridge
                      - name: svid
                        emptyDir: {}
                      # CNPG server CA (published by the spire-ca-bridge CronJob)
                      - name: cnpg-ca
                        secret:
                          secretName: cnpg-server-ca
                    containers:
                      - name: db-bridge
                        volumeMounts:
                          - name: spiffe
                            mountPath: /run/spiffe
                            readOnly: true
                          - name: svid
                            mountPath: /spiffe
                          - name: cnpg-ca
                            mountPath: /cnpg-ca
                            readOnly: true
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [1000]
        seccompProfile: { type: RuntimeDefault }
    controllers:
      lidarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/lidarr
              tag: 3.2.0.5144@sha256:d460ea8d1a02673c4d82b911acea01d5496ddf2ef28be57d30c60bf208ae6765
            env:
              TZ: Europe/Amsterdam
              LIDARR__APP__INSTANCENAME: Lidarr
              LIDARR__APP__THEME: dark
              LIDARR__AUTH__METHOD: External
              LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
              LIDARR__LOG__DBENABLED: "False"
              LIDARR__LOG_LEVEL: info
              LIDARR__SERVER__PORT: &port 8686
            envFrom:
              - secretRef:
                  name: lidarr-secret

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          # SPIFFE-aware Postgres bridge: spiffe-helper fetches/rotates the
          # SVID (CN=lidarr); the bridge serves Lidarr on loopback and presents
          # the SVID to the CNPG rw service (pg_hba "cert"). No DB password
          # involved. (volumeMounts are added by the postRenderer: the chart
          # schema does not allow them in values)
          db-bridge:
            image:
              repository: ghcr.io/ronaldphilipsen/db-bridge
              tag: 1.2.0@sha256:7e2b6a81e7f08d2a3f351c4b2e89b022d54f98305f28d1844b4efa070d9e930b
            probes:
              # the bridge listens on loopback only, so a kubelet tcpSocket
              # probe (which dials the pod IP) can never work; ask the binary
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: lidarr
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["lidarr.rphilipsen.nl"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      # advancedMounts: without them, app-template mounts every persistence
      # item into every container; scope app data to the app container only
      config:
        existingClaim: *app
        advancedMounts:
          lidarr:
            app:
              - path: /config

      data:
        existingClaim: media-nfs
        advancedMounts:
          lidarr:
            app:
              - path: /data

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    PodAnnotations:
      secret.reloader.stakater.com/reload: lidarr-secret
