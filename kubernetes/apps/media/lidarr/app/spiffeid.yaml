---
# SPIFFE identity for the Lidarr pod: SVID with CN=lidarr (the Postgres role)
# and URI SAN spiffe://spiffe.rphilipsen.nl/ns/media/sa/lidarr.
# Cluster-scoped: the hardened chart only ships the ClusterSPIFFEID CRD.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: lidarr
spec:
  # the controller manager only watches its own class (watchClassless: false)
  className: spiffe-spire
  spiffeIDTemplate: "spiffe://spiffe.rphilipsen.nl/ns/media/sa/lidarr"
  dnsNameTemplates:
    - lidarr
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: media
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lidarr
