---
# SPIFFE identity for the Seerr pod: SVID with CN=seerr (the Postgres role)
# and URI SAN spiffe://spiffe.rphilipsen.nl/ns/media/sa/seerr.
# Cluster-scoped: the hardened chart only ships the ClusterSPIFFEID CRD.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: seerr
spec:
  # the controller manager only watches its own class (watchClassless: false)
  className: spiffe-spire
  spiffeIDTemplate: "spiffe://spiffe.rphilipsen.nl/ns/media/sa/seerr"
  dnsNameTemplates:
    - seerr
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: media
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seerr
