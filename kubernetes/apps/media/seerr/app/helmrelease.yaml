---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app seerr
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  interval: 1h
  # app-template's schema allows neither pod.volumes nor container
  # volumeMounts, so the db-bridge volumes and their mounts are added here
  # (strategic merge: containers merge by name, volumes by name).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: seerr
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: seerr
              spec:
                template:
                  spec:
                    volumes:
                      # SPIRE agent Workload API socket
                      - name: spiffe
                        csi:
                          driver: csi.spiffe.io
                          readOnly: true
                      # SVID files written by spiffe-helper, read by the bridge
                      - name: svid
                        emptyDir: {}
                      # CNPG server CA (published by the spire-ca-bridge CronJob)
                      - name: cnpg-ca
                        secret:
                          secretName: cnpg-server-ca
                    initContainers:
                      - name: db-bridge
                        volumeMounts:
                          - name: spiffe
                            mountPath: /run/spiffe
                            readOnly: true
                          - name: svid
                            mountPath: /spiffe
                          - name: cnpg-ca
                            mountPath: /cnpg-ca
                            readOnly: true
  values:
    controllers:
      seerr:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [1000]
            seccompProfile: { type: RuntimeDefault }
        initContainers:
          # SPIFFE-aware Postgres bridge: spiffe-helper fetches/rotates the
          # SVID (CN=seerr); the bridge serves Seerr on loopback and presents
          # the SVID to the CNPG rw service (pg_hba "cert"). (volumeMounts
          # are added by the postRenderer: the chart schema does not allow
          # them in values)
          db-bridge:
            # native sidecar: the kubelet starts it before the app and
            # starts the app only after the startup probe passes (the
            # bridge listens only once it has the SVID), then keeps it
            # running next to the app
            restartPolicy: Always
            image:
              repository: ghcr.io/ronaldphilipsen/db-bridge
              tag: 1.4.0@sha256:eae8ae4385aa065f0e4a2830587bc1a595a165a8b2acb88eeb2de0bfbb3f5772
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  periodSeconds: 2
                  timeoutSeconds: 3
                  failureThreshold: 45
              # the bridge listens on loopback only, so a kubelet tcpSocket
              # probe (which dials the pod IP) can never work; ask the binary
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
            env:
              TZ: "Europe/Amsterdam"
              PORT: &port 5055
              # Postgres through the local db-bridge sidecar, which presents
              # the pod's SPIFFE SVID (CN=seerr) to CNPG (pg_hba "cert").
              # Nothing checks the password; it is only a placeholder.
              # trust the internal CA for the HTTPS backends (Jellyfin 8920,
              # Radarr/Sonarr 9898); read once at startup, root valid to 2036
              NODE_EXTRA_CA_CERTS: /etc/internal-ca/ca.crt
              DB_TYPE: postgres
              DB_HOST: 127.0.0.1
              DB_PORT: "5432"
              DB_USER: seerr
              DB_PASS: unused-spiffe-cert-auth
              DB_NAME: seerr
            probes:
              # TCP checks, not /api/v1/status: that endpoint asks the GitHub
              # releases API for the latest version and blocks past the probe
              # timeout when GitHub is slow or down (503/504), which made
              # the kubelet restart Seerr in a loop.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 36
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 250Mi
              limits:
                memory: 500Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [1000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        labels:
          expose: public
        hostnames: ["requests.rphilipsen.nl"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      internal-ca:
        type: configMap
        name: internal-ca
        advancedMounts:
          seerr:
            app:
              - path: /etc/internal-ca
                readOnly: true
      config:
        existingClaim: "{{ .Release.Name }}"
        # advancedMounts: keep the app config out of the db-bridge sidecar
        advancedMounts:
          seerr:
            app:
              - path: /app/config
      tmp:
        type: emptyDir
