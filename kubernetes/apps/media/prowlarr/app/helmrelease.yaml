---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prowlarr
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  interval: 30m
  # app-template's schema allows neither pod.volumes nor container
  # volumeMounts, so the db-bridge volumes and their mounts are added here
  # (strategic merge: containers merge by name, volumes by name).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: prowlarr
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: prowlarr
              spec:
                template:
                  spec:
                    volumes:
                      # SPIRE agent Workload API socket
                      - name: spiffe
                        csi:
                          driver: csi.spiffe.io
                          readOnly: true
                      # SVID files written by spiffe-helper, read by the bridge
                      - name: svid
                        emptyDir: {}
                      # CNPG server CA (published by the spire-ca-bridge CronJob)
                      - name: cnpg-ca
                        secret:
                          secretName: cnpg-server-ca
                    initContainers:
                      - name: db-bridge
                        volumeMounts:
                          - name: spiffe
                            mountPath: /run/spiffe
                            readOnly: true
                          - name: svid
                            mountPath: /spiffe
                          - name: cnpg-ca
                            mountPath: /cnpg-ca
                            readOnly: true
  values:
    controllers:
      prowlarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        initContainers:
          # SPIFFE-aware Postgres bridge: spiffe-helper fetches/rotates the
          # SVID (CN=prowlarr); the bridge serves Prowlarr on loopback and
          # presents the SVID to the CNPG rw service (pg_hba "cert"). No DB
          # password involved. (volumeMounts are added by the postRenderer:
          # the chart schema does not allow them in values)
          db-bridge:
            # native sidecar: the kubelet starts it before the app and
            # starts the app only after the startup probe passes (the
            # bridge listens only once it has the SVID), then keeps it
            # running next to the app
            restartPolicy: Always
            image:
              repository: ghcr.io/ronaldphilipsen/db-bridge
              tag: 1.4.0@sha256:eae8ae4385aa065f0e4a2830587bc1a595a165a8b2acb88eeb2de0bfbb3f5772
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  periodSeconds: 2
                  timeoutSeconds: 3
                  failureThreshold: 45
              # the bridge listens on loopback only, so a kubelet tcpSocket
              # probe (which dials the pod IP) can never work; ask the binary
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 3.0.0.5737@sha256:0954599432e16ccd86129f1eb8eb0247fd0d1591aab400f73e2010a1cda37be8
            env:
              TZ: "Europe/Amsterdam"
              PROWLARR__APP__INSTANCENAME: Prowlarr
              PROWLARR__APP__THEME: dark
              PROWLARR__AUTH__METHOD: External
              PROWLARR__LOG__DBENABLED: "False"
              PROWLARR__LOG__LEVEL: info
              PROWLARR__SERVER__PORT: &port 9696
              # native TLS on 6969 (tls.yaml); the plain port stays for probes and
              # in-cluster clients that do not use TLS yet
              PROWLARR__SERVER__ENABLESSL: "True"
              PROWLARR__SERVER__SSLPORT: &tlsport 6969
              PROWLARR__SERVER__SSLCERTPATH: /tls/keystore.p12
              PROWLARR__SERVER__SSLCERTPASSWORD: prowlarr
              # trust store = public CAs + internal CA (ConfigMap internal-ca-bundle),
              # so HTTPS to internal backends (SABnzbd 9090, the other Arr apps)
              # verifies; .NET reads it once at startup
              SSL_CERT_FILE: /etc/internal-ca-bundle/ca-certificates.crt
              PROWLARR__UPDATE__BRANCH: develop
            envFrom:
              - secretRef:
                  name: prowlarr-secret

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 18m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          https:
            port: *tlsport

    persistence:
      internal-ca-bundle:
        type: configMap
        name: internal-ca-bundle
        advancedMounts:
          prowlarr:
            app:
              - path: /etc/internal-ca-bundle
                readOnly: true
      tls:
        type: secret
        name: prowlarr-tls
        defaultMode: 0440
        advancedMounts:
          prowlarr:
            app:
              - path: /tls
                readOnly: true
      # advancedMounts: without them, app-template mounts every persistence
      # item into every container; scope app data to the app container only
      config:
        existingClaim: *app
        advancedMounts:
          prowlarr:
            app:
              - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        hostnames: ["{{ .Release.Name }}.rphilipsen.nl"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          # HTTPS backend; BackendTLSPolicy prowlarr (tls.yaml) verifies it
          - backendRefs:
              - name: *app
                port: *tlsport

    PodAnnotations:
      secret.reloader.stakater.com/reload: prowlarr-secret
