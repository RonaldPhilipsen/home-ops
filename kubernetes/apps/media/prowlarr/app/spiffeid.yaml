---
# SPIFFE identity for the Prowlarr pod: SVID with CN=prowlarr (the Postgres
# role) and URI SAN spiffe://spiffe.rphilipsen.nl/ns/media/sa/prowlarr.
# Cluster-scoped: the hardened chart only ships the ClusterSPIFFEID CRD.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: prowlarr
spec:
  # the controller manager only watches its own class (watchClassless: false)
  className: spiffe-spire
  spiffeIDTemplate: "spiffe://spiffe.rphilipsen.nl/ns/media/sa/prowlarr"
  dnsNameTemplates:
    - prowlarr
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: media
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
