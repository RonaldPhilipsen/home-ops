---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sabnzbd
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  interval: 30m
  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image: &image
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
            env:
              TZ: "Europe/Amsterdam"
              SABNZBD__PORT: &port 8080
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sab,
                sab.default,
                sab.media.svc,
                sab.media.svc.cluster,
                sab.media.svc.cluster.local,
                sab.rphilipsen.nl
                sabnzbd,
                sabnzbd.default,
                sabnzbd.media.svc,
                sabnzbd.media.svc.cluster,
                sabnzbd.media.svc.cluster.local,
                sabnzbd.rphilipsen.nl
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 5m
                memory: 1Gi
              limits:
                memory: 12Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        # Enables SABnzbd's native HTTPS (9090, tls.yaml) in sabnzbd.ini on
        # every start, so the setting lives in git; the image maps only a few
        # SABNZBD__* keys. With https_port set, HTTP stays on 8080 for the
        # probes and the Arr apps. On the very first boot the ini is created
        # by the app itself.
        initContainers:
          ini-tls:
            image: *image
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                f=/config/sabnzbd.ini
                [ -f "$f" ] || { echo "no $f yet (first boot)"; exit 0; }
                sed -i \
                  -e 's|^enable_https *=.*$|enable_https = 1|' \
                  -e 's|^https_port *=.*$|https_port = 9090|' \
                  -e 's|^https_cert *=.*$|https_cert = /tls/tls.crt|' \
                  -e 's|^https_key *=.*$|https_key = /tls/tls.key|' \
                  "$f"
                grep -E '^(enable_https|https_port|https_cert|https_key) ' "$f"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          https:
            port: &tlsport 9090
    route:
      app:
        hostnames: ["sab.rphilipsen.nl", "sabnzbd.rphilipsen.nl"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          # HTTPS backend; BackendTLSPolicy sabnzbd (tls.yaml) verifies it
          - backendRefs:
              - name: *app
                port: *tlsport
    persistence:
      config:
        existingClaim: *app
      tls:
        type: secret
        name: sabnzbd-tls
        defaultMode: 0440
        advancedMounts:
          sabnzbd:
            app:
              - path: /tls
                readOnly: true
      data:
        existingClaim: media-nfs
      incomplete:
        type: emptyDir
        globalMounts:
          - path: /config/incomplete
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
