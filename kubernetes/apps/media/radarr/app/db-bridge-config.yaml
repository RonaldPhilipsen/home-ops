---
# pgbouncer config for the Radarr db-bridge sidecar: loopback trust listener,
# upstream to the CNPG rw service presenting the SVID (CN=radarr).
apiVersion: v1
kind: ConfigMap
metadata:
  name: radarr-db-bridge
  namespace: media
data:
  pgbouncer.ini: |
    # [databases] takes pgbouncer keys only (no libpq ssl* keywords). The
    # upstream TLS, with the SVID (CN=radarr) as the client cert, is set by
    # the server_tls_* keys below. user= forces the upstream role.
    [databases]
    radarr = host=postgres-rw.database.svc port=5432 dbname=radarr user=radarr

    [pgbouncer]
    listen_addr = 127.0.0.1
    listen_port = 5432
    # any: no client auth, the client user name is ignored (loopback only);
    # every database above forces its user, so no auth_file is needed.
    auth_type = any
    pidfile = /tmp/pgbouncer.pid
    server_tls_sslmode = verify-full
    server_tls_ca_file = /cnpg-ca/ca.crt
    server_tls_cert_file = /spiffe/svid.crt
    server_tls_key_file = /spiffe/svid.key
