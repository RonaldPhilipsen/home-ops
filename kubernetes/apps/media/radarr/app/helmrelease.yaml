---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app radarr
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  interval: 30m
  # app-template's schema allows neither pod.volumes nor container
  # volumeMounts, so the db-bridge volumes and their mounts are added here
  # (strategic merge: containers merge by name, volumes by name).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: radarr
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: radarr
              spec:
                template:
                  spec:
                    volumes:
                      # SPIRE agent Workload API socket
                      - name: spiffe
                        csi:
                          driver: csi.spiffe.io
                          readOnly: true
                      # SVID files written by spiffe-helper, read by the bridge
                      - name: svid
                        emptyDir: {}
                      # CNPG server CA (published by the spire-ca-bridge CronJob)
                      - name: cnpg-ca
                        secret:
                          secretName: cnpg-server-ca
                    containers:
                      - name: db-bridge
                        volumeMounts:
                          - name: spiffe
                            mountPath: /run/spiffe
                            readOnly: true
                          - name: svid
                            mountPath: /spiffe
                          - name: cnpg-ca
                            mountPath: /cnpg-ca
                            readOnly: true
  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [1000]
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.1.10859@sha256:ffe1f4d7c30b33a1e1256e14ace0eefddf120b37d8defceba208e9c190772f8d
            env:
              TZ: "Europe/Amsterdam"
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__ALLOWEDHOSTS: "radarr.rphilipsen.nl,radarr.media.svc.cluster.local"
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &port 7878
              RADARR__UPDATE__BRANCH: develop
            envFrom:
              - secretRef:
                  name: radarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 384Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # SPIFFE-aware Postgres bridge: spiffe-helper fetches/rotates the
          # SVID (CN=radarr); the bridge serves Radarr on loopback and presents
          # the SVID to the CNPG rw service (pg_hba "cert"). No DB password
          # involved. (volumeMounts are added by the postRenderer: the chart
          # schema does not allow them in values)
          db-bridge:
            image:
              repository: ghcr.io/ronaldphilipsen/db-bridge
              tag: 1.1.2@sha256:e60db19442d648d6e82f90fc74c73cb01f3da02516d9182946700fdcc4a71a72
            probes:
              # the bridge listens on loopback only, so a kubelet tcpSocket
              # probe (which dials the pod IP) can never work; ask the binary
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.rphilipsen.nl"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      # advancedMounts: without them, app-template mounts every persistence
      # item into every container; scope app data to the app container only
      config:
        existingClaim: *app
        advancedMounts:
          radarr:
            app:
              - path: /config
      data:
        existingClaim: media-nfs
        advancedMounts:
          radarr:
            app:
              - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    PodAnnotations:
      secret.reloader.stakater.com/reload: radarr-secret
