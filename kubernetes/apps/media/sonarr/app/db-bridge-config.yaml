---
# pgbouncer config for the Sonarr db-bridge sidecar: loopback trust listener,
# upstream to the CNPG rw service presenting the SVID (CN=sonarr).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarr-db-bridge
  namespace: media
data:
  pgbouncer.ini: |
    # upstream connection is libpq: the SVID (CN=sonarr) is presented as the
    # client cert; pgbouncer has no cert options of its own, so the ssl*
    # keywords live in the connection string.
    [databases]
    sonarr = host=postgres-rw.database.svc port=5432 dbname=sonarr user=sonarr sslmode=require sslcert=/spiffe/svid.crt sslkey=/spiffe/svid.key sslrootcert=/cnpg-ca/ca.crt

    [pgbouncer]
    listen_addr = 127.0.0.1
    listen_port = 5432
    auth_type = trust
    pidfile = /tmp/pgbouncer.pid
