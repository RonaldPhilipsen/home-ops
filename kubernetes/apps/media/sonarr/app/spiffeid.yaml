---
# SPIFFE identity for the Sonarr pod: SVID with CN=sonarr (the Postgres role)
# and URI SAN spiffe://spiffe.rphilipsen.nl/ns/media/sa/sonarr.
# Cluster-scoped: the hardened chart only ships the ClusterSPIFFEID CRD.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: sonarr
spec:
  # the controller manager only watches its own class (watchClassless: false)
  className: spiffe-spire
  spiffeIDTemplate: "spiffe://spiffe.rphilipsen.nl/ns/media/sa/sonarr"
  dnsNameTemplates:
    - sonarr
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: media
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sonarr
