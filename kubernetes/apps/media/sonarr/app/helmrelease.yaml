---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  interval: 30m
  # app-template's schema allows neither pod.volumes nor container
  # volumeMounts, so the db-bridge volumes and their mounts are added here
  # (strategic merge: containers merge by name, volumes by name).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: sonarr
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: sonarr
              spec:
                template:
                  spec:
                    volumes:
                      # SPIRE agent Workload API socket
                      - name: spiffe
                        csi:
                          driver: csi.spiffe.io
                          readOnly: true
                      # SVID files written by spiffe-helper, read by the bridge
                      - name: svid
                        emptyDir: {}
                      # CNPG server CA (published by the spire-ca-bridge CronJob)
                      - name: cnpg-ca
                        secret:
                          secretName: cnpg-server-ca
                    initContainers:
                      - name: db-bridge
                        volumeMounts:
                          - name: spiffe
                            mountPath: /run/spiffe
                            readOnly: true
                          - name: svid
                            mountPath: /spiffe
                          - name: cnpg-ca
                            mountPath: /cnpg-ca
                            readOnly: true
  values:
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          # SPIFFE-aware Postgres bridge: spiffe-helper fetches/rotates the
          # SVID (CN=sonarr); the bridge serves Sonarr on loopback and presents
          # the SVID to the CNPG rw service (pg_hba "cert"). No DB password
          # involved. (volumeMounts are added by the postRenderer: the chart
          # schema does not allow them in values)
          db-bridge:
            # native sidecar: the kubelet starts it before the app and
            # starts the app only after the startup probe passes (the
            # bridge listens only once it has the SVID), then keeps it
            # running next to the app
            restartPolicy: Always
            image:
              repository: ghcr.io/ronaldphilipsen/db-bridge
              tag: 1.4.0@sha256:eae8ae4385aa065f0e4a2830587bc1a595a165a8b2acb88eeb2de0bfbb3f5772
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  periodSeconds: 2
                  timeoutSeconds: 3
                  failureThreshold: 45
              # the bridge listens on loopback only, so a kubelet tcpSocket
              # probe (which dials the pod IP) can never work; ask the binary
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2941@sha256:93b0923dd12afd43247739e19dac59d74c52a15ea12e036b7ced264cffb42574
            env:
              TZ: "Europe/Amsterdam"
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__APP__THEME: dark
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &port 8989
              # native TLS on 9898 (tls.yaml); the plain port stays for probes and
              # in-cluster clients that do not use TLS yet
              SONARR__SERVER__ENABLESSL: "True"
              SONARR__SERVER__SSLPORT: &tlsport 9898
              SONARR__SERVER__SSLCERTPATH: /tls/keystore.p12
              SONARR__SERVER__SSLCERTPASSWORD: sonarr
              # trust store = public CAs + internal CA (ConfigMap internal-ca-bundle),
              # so HTTPS to internal backends (SABnzbd 9090, the other Arr apps)
              # verifies; .NET reads it once at startup
              SSL_CERT_FILE: /etc/internal-ca-bundle/ca-certificates.crt
              SONARR__UPDATE__BRANCH: develop
            envFrom:
              - secretRef:
                  name: sonarr-secret

            probes:
              # startup: a slow boot (e.g. many pods restarting at once) must
              # not trip the 1s liveness probe; liveness starts after this
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 384Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: sonarr
        ports:
          http:
            port: *port
          https:
            port: *tlsport

    route:
      app:
        hostnames: ["{{ .Release.Name }}.rphilipsen.nl"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          # HTTPS backend; BackendTLSPolicy sonarr (tls.yaml) verifies it
          - backendRefs:
              - name: *app
                port: *tlsport

    persistence:
      internal-ca-bundle:
        type: configMap
        name: internal-ca-bundle
        advancedMounts:
          sonarr:
            app:
              - path: /etc/internal-ca-bundle
                readOnly: true
      tls:
        type: secret
        name: sonarr-tls
        defaultMode: 0440
        advancedMounts:
          sonarr:
            app:
              - path: /tls
                readOnly: true
      # advancedMounts: without them, app-template mounts every persistence
      # item into every container; scope app data to the app container only
      config:
        existingClaim: sonarr
        advancedMounts:
          sonarr:
            app:
              - path: /config
      data:
        existingClaim: media-nfs
        advancedMounts:
          sonarr:
            app:
              - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    PodAnnotations:
      secret.reloader.stakater.com/reload: sonarr-secret
