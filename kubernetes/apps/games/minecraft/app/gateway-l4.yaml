---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: minecraft
  namespace: games
  labels:
    expose: public
  annotations:
    external-dns.kubernetes.io/controller: none
    external-dns.kubernetes.io/hostname: mc.rphilipsen.nl
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: minecraft
  rules:
    - backendRefs:
        - name: minecraft
          port: 25565
