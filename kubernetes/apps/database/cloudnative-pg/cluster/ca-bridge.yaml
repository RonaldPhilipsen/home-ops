---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spiffe-ca-bridge
  namespace: database
---
# Reads the fixed CNPG CA (postgres-ca) and writes the combined
# postgres-spipe-client-ca secret.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.v1/role.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spiffe-ca-bridge
  namespace: database
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-ca"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-spipe-client-ca"]
    verbs: ["create", "get", "update", "patch"]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.v1/rolebinding.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spiffe-ca-bridge
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spiffe-ca-bridge
subjects:
  - kind: ServiceAccount
    name: spiffe-ca-bridge
    namespace: database
---
# Reads the SPIRE trust bundle (PEM) from the spire server via its CLI.
# Lives in the spiffe area (kubernetes/apps/spiffe/ca-bridge-rbac.yaml) because
# the cluster Kustomization's targetNamespace would relocate it to database.
# The RoleBinding here references the database-namespace service account.
---
# Keeps postgres-spipe-client-ca current:
#   ca.crt = <postgres-ca.ca.crt> + <SPIRE X.509 bundle (PEM)>
#   ca.key = <postgres-ca.ca.key>
# CNPG uses this secret as clientCASecret (ssl_ca_file), so Postgres trusts
# both its own CA (replication/pooler certs) and the SPIRE CA (app SVIDs).
# The SPIRE half is fetched live from the server (spire-server bundle show),
# so a CA rotation is picked up on the next run.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/cronjob.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spire-ca-bridge
  namespace: database
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: spire-ca-bridge
        spec:
          serviceAccountName: spiffe-ca-bridge
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: bridge
              # renovate: image=fhoekstra/kubectl-shell
              image: ghcr.io/fhoekstra/kubectl-shell:v1.36.1-1
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -c
                - |
                  set -eu
                  # 1. Fixed CNPG CA (server + signing key for internal certs)
                  CA_CRT=$(kubectl -n database get secret postgres-ca -o jsonpath='{.data.ca\.crt}' | base64 -d)
                  CA_KEY=$(kubectl -n database get secret postgres-ca -o jsonpath='{.data.ca\.key}' | base64 -d)
                  [ -n "$CA_CRT" ] || { echo "ERROR: postgres-ca ca.crt is empty" >&2; exit 1; }
                  [ -n "$CA_KEY" ] || { echo "ERROR: postgres-ca ca.key is empty" >&2; exit 1; }
                  # 2. Current SPIRE X.509 bundle (PEM) straight from the server
                  SPIRE_BUNDLE=$(kubectl -n spiffe exec spire-server-0 -c spire-server -- spire-server bundle show -socketPath /tmp/spire-server/private/api.sock)
                  [ -n "$SPIRE_BUNDLE" ] || { echo "ERROR: spire-server bundle show returned empty" >&2; exit 1; }
                  case "$SPIRE_BUNDLE" in *BEGIN\ CERTIFICATE*) ;; *) echo "ERROR: bundle is not PEM" >&2; exit 1;; esac
                  # 3. Combined bundle; apply only when it changed
                  COMBINED="${CA_CRT}
                  ${SPIRE_BUNDLE}"
                  EXISTING=$(kubectl -n database get secret postgres-spipe-client-ca -o jsonpath='{.data.ca\.crt}' 2>/dev/null | base64 -d || true)
                  if [ "$EXISTING" = "$COMBINED" ]; then
                    echo "postgres-spipe-client-ca unchanged; nothing to do"
                    exit 0
                  fi
                  kubectl -n database create secret generic postgres-spipe-client-ca \
                    --from-literal=ca.crt="$COMBINED" \
                    --from-literal=ca.key="$CA_KEY" \
                    --dry-run=client -o yaml | kubectl apply -f -
                  echo "postgres-spipe-client-ca updated"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
