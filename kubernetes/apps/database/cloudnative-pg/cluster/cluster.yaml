---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    # required for seamless bootstrap: https://github.com/cloudnative-pg/cloudnative-pg/issues/5778#issuecomment-2783417464
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 2
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  affinity:
    enablePodAntiAffinity: false
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
  primaryUpdateStrategy: unsupervised
  storage:
    size: 15Gi
    storageClass: local-hostpath
    resizeInUseVolumes: True
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  certificates:
    # Combined CNPG + SPIRE CA (kept current by the spire-ca-bridge CronJob):
    # Postgres trusts its own CA (replication/pooler) and the SPIRE CA (app SVIDs).
    clientCASecret: postgres-spipe-client-ca
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: AWS_SECRET_ACCESS_KEY
    - name: AWS_REGION
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: AWS_REGION
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
    # SPIFFE cert auth for migrated roles (user-defined section: precedes the
    # default scram catch-all). SVID CN = role name.
    pg_hba:
      - hostssl all radarr all cert
      - hostnossl all radarr all reject
      - hostssl all sonarr all cert
      - hostnossl all sonarr all reject

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &pluginparams
        barmanObjectName: garage
        serverName: postgres
  managed:
    roles:
      # radarr + sonarr authenticate with SPIFFE SVIDs (pg_hba "cert");
      # no password, by design.
      - name: radarr
        login: true
        superuser: false
        createdb: false
      - name: sonarr
        login: true
        superuser: false
        createdb: false
      - name: lidarr
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: lidarr-db-credentials
      - name: prowlarr
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: prowlarr-db-credentials
      - name: lldap
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: lldap-db-credentials
      - name: authelia
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: authelia-db-credentials

  bootstrap:
    recovery:
      source: source
      # recoveryTarget:
      #   targetTime: "2026-09-06 00:00:00.00000+00"

  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *pluginparams

  resources:
    requests:
      cpu: 500m
    limits:
      hugepages-2Mi: 500Mi
      memory: 2Gi

  monitoring:
    enablePodMonitor: true

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
