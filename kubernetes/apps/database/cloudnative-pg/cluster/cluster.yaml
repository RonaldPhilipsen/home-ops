---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    # required for seamless bootstrap: https://github.com/cloudnative-pg/cloudnative-pg/issues/5778#issuecomment-2783417464
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 2
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  affinity:
    enablePodAntiAffinity: false
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
  primaryUpdateStrategy: unsupervised
  storage:
    size: 15Gi
    storageClass: local-hostpath
    resizeInUseVolumes: True
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  certificates:
    # Combined CNPG + SPIRE CA (kept current by the spire-ca-bridge CronJob):
    # Postgres trusts its own CA (replication/pooler) and the SPIRE CA (app SVIDs).
    clientCASecret: postgres-spipe-client-ca
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: AWS_SECRET_ACCESS_KEY
    - name: AWS_REGION
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: AWS_REGION
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
    # SPIFFE cert auth for migrated roles (user-defined section: precedes the
    # default scram catch-all). SVID CN = role name.
    pg_hba:
      - hostssl all radarr all cert
      - hostnossl all radarr all reject
      - hostssl all sonarr all cert
      - hostnossl all sonarr all reject
      - hostssl all lidarr all cert
      - hostnossl all lidarr all reject
      - hostssl all prowlarr all cert
      - hostnossl all prowlarr all reject
      - hostssl all lldap all cert
      - hostnossl all lldap all reject
      - hostssl all authelia all cert
      - hostnossl all authelia all reject
      - hostssl all seerr all cert
      - hostnossl all seerr all reject
      - hostssl all pgadmin all cert
      - hostnossl all pgadmin all reject

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &pluginparams
        barmanObjectName: garage
        serverName: postgres
  managed:
    roles:
      # Every app role authenticates with its SPIFFE SVID (pg_hba "cert",
      # CN = role). disablePassword clears any old password in the database:
      # without it, removing passwordSecret leaves the password unchanged.
      - name: radarr
        login: true
        superuser: false
        createdb: false
        disablePassword: true
      - name: sonarr
        login: true
        superuser: false
        createdb: false
        disablePassword: true
      - name: lidarr
        login: true
        superuser: false
        createdb: false
        disablePassword: true
      - name: prowlarr
        login: true
        superuser: false
        createdb: false
        disablePassword: true
      - name: lldap
        login: true
        superuser: false
        createdb: false
        disablePassword: true
      - name: authelia
        login: true
        superuser: false
        createdb: false
        disablePassword: true
      - name: seerr
        login: true
        superuser: false
        createdb: false
        disablePassword: true
      # pgAdmin (database/pgadmin) logs in with its SPIFFE SVID (CN=pgadmin)
      # through db-bridge; superuser by decision, its UI is behind Authelia
      # 2FA (group lldap_admin).
      - name: pgadmin
        login: true
        superuser: true
        disablePassword: true

  bootstrap:
    recovery:
      source: source
      # recoveryTarget:
      #   targetTime: "2026-09-06 00:00:00.00000+00"

  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *pluginparams

  resources:
    requests:
      cpu: 500m
    limits:
      hugepages-2Mi: 500Mi
      memory: 2Gi

  monitoring:
    enablePodMonitor: true

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
