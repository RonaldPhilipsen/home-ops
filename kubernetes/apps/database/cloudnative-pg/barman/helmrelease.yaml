---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.9.0
        digest: sha256:d34ada2eedffaee9153c6ae31e0e5b93fd28765cc8fba7c5fb45d4ed6b60df1a
      url: oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
  interval: 1h
  values:
    crds:
      create: true
    # Install the plugin in the same namespace as the CNPG operator.
    namespaceOverride: database
