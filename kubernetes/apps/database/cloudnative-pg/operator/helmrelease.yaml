---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 0.29.1
      url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg

  values:
    crds:
      create: true
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true

    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi

    podAnnotations:
      secret.reloader.stakater.com/reload: cloudnative-pg-secret
