---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# VerneMQ user for the Victron dbus-mqtt-pv driver on Venus OS (192.168.0.21).
# VerneMQ takes the username from the env var name: DOCKER_VERNEMQ_USER_<username>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vernemq-victron
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vernemq-victron-secret
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |
            DOCKER_VERNEMQ_USER_{{ .username | upper }}: {{ .password | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: victron
        property: username
    - secretKey: password
      remoteRef:
        key: victron
        property: password
