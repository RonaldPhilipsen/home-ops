---
# Random values generated in-cluster once (refreshInterval "0"), so they
# are not in git or 1Password.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: pgadmin
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# OIDC client secret, shared with Authelia. Authelia reads this secret through
# its pgadmin-database SecretStore, which the Role below allows.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-oidc
spec:
  refreshInterval: "0"
  target:
    name: pgadmin-oidc
    template:
      engineVersion: v2
      data:
        PGADMIN_OAUTH_CLIENT_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pgadmin
---
# Password of pgAdmin's internal setup user. pgAdmin requires it, but
# login is OIDC-only (AUTHENTICATION_SOURCES = ['oauth2']).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-default
spec:
  refreshInterval: "0"
  target:
    name: pgadmin-default
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pgadmin
---
# Lets Authelia's SecretStore pgadmin-database (namespace security) read
# this one secret for its client list.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.v1/role.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authelia-pgadmin-oidc-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["pgadmin-oidc"]
    verbs: ["get"]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.v1/rolebinding.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authelia-pgadmin-oidc-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authelia-pgadmin-oidc-reader
subjects:
  - kind: ServiceAccount
    name: authelia-secret-reader
    namespace: security
