---
# Random values generated in-cluster once (refreshInterval "0"), so they
# are not in git or 1Password.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: pgadmin
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# OIDC client secret, shared with Authelia (it reads this secret through
# its valkey-database SecretStore; Role in
# kubernetes/apps/database/valkey/cluster/authelia-user.yaml).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-oidc
spec:
  refreshInterval: "0"
  target:
    name: pgadmin-oidc
    template:
      engineVersion: v2
      data:
        PGADMIN_OAUTH_CLIENT_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pgadmin
---
# Password of pgAdmin's internal setup user. pgAdmin requires it, but
# login is OIDC-only (AUTHENTICATION_SOURCES = ['oauth2']).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-default
spec:
  refreshInterval: "0"
  target:
    name: pgadmin-default
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pgadmin
