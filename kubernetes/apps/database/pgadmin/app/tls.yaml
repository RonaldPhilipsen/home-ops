---
# Backend TLS for pgAdmin (PGADMIN_ENABLE_TLS: HTTPS on 5050 instead of
# HTTP). Issued by the internal CA; pgAdmin loads tls.crt/tls.key from
# /certs at startup, and Reloader restarts it when cert-manager renews.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pgadmin-tls
spec:
  secretName: pgadmin-tls
  dnsNames:
    - pgadmin.database.svc.cluster.local
    - pgadmin.database.svc
    - pgadmin.database
  duration: 2160h # 90d
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: internal-ca
---
# The gateway connects to pgAdmin over HTTPS and verifies the certificate
# against the internal CA (ConfigMap internal-ca from trust-manager; Cilium
# accepts only ConfigMap CA refs).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/backendtlspolicy_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: pgadmin
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: pgadmin
      sectionName: https
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: internal-ca
    hostname: pgadmin.database.svc.cluster.local
