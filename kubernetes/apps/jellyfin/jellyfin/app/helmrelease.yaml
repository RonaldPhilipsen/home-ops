---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
  namespace: media
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  maxHistory: 2
  install:
    remediation:
      retries: 0
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        fsGroup: 2000
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups: [160, 140, 241, 0, 10, 121, 44, 65537, 1000]
        seccompProfile: { type: RuntimeDefault }
      hostNetwork: false

    # pin to the node with the AMD iGPU (/dev/dri); beta has no GPU
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k8s-neo-alpha

    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          main:
            image: &image
              repository:  ghcr.io/jellyfin/jellyfin
              tag: 12.0.20260908-012347@sha256:74f4d87d9cf262c52d62be6be265c0355c6a7e21d0477ab6c654a49a4f8b1fd4
              pullPolicy: IfNotPresent

            env:
              TZ: "Europe/Amsterdam"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              JELLYFIN_FFmpeg__probesize: 50000000
              JELLYFIN_FFmpeg__analyzeduration: 50000000
              JELLYFIN_PublishedServerUrl: &url "jellyfin.rphilipsen.nl"

            # VAAPI hardware acceleration via /dev/dri (renderD128 is world-writable, no privileged needed)
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3

              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 30
            # resources:
            #   requests:
            #     gpu.intel.com/i915: 1
            #   limits:
            #     gpu.intel.com/i915: 1
            #     # memory: 8Gi

        # Enables Jellyfin's native HTTPS (8920, tls.yaml) in network.xml on
        # every start, so the setting lives in git. HTTP 8096 stays for
        # probes. On the very first boot network.xml does not exist yet.
        initContainers:
          network-tls:
            image: *image
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                f=/config/config/network.xml
                [ -f "$f" ] || { echo "no $f yet (first boot)"; exit 0; }
                sed -i \
                  -e 's|<EnableHttps>[^<]*</EnableHttps>|<EnableHttps>true</EnableHttps>|' \
                  -e 's|<RequireHttps>[^<]*</RequireHttps>|<RequireHttps>false</RequireHttps>|' \
                  -e 's|<InternalHttpsPort>[^<]*</InternalHttpsPort>|<InternalHttpsPort>8920</InternalHttpsPort>|' \
                  -e 's|<CertificatePath */>|<CertificatePath>/tls/keystore.p12</CertificatePath>|' \
                  -e 's|<CertificatePath>[^<]*</CertificatePath>|<CertificatePath>/tls/keystore.p12</CertificatePath>|' \
                  -e 's|<CertificatePassword */>|<CertificatePassword>jellyfin</CertificatePassword>|' \
                  -e 's|<CertificatePassword>[^<]*</CertificatePassword>|<CertificatePassword>jellyfin</CertificatePassword>|' \
                  "$f"
                grep -E 'EnableHttps|CertificatePath|InternalHttpsPort' "$f"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: *port
          https:
            port: &tlsport 8920

    route:
      app:
        labels:
          expose: public
        hostnames: [*url]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          # HTTPS backend; BackendTLSPolicy jellyfin (tls.yaml) verifies it
          - backendRefs:
              - name: *app
                port: *tlsport

    persistence:
      config:
        existingClaim: *app

      tls:
        type: secret
        name: jellyfin-tls
        defaultMode: 0440
        advancedMounts:
          jellyfin:
            main:
              - path: /tls
                readOnly: true

      data:
        existingClaim: jellyfin-nfs

      transcode:
        type: emptyDir
        globalMounts:
          - path: /transcode

      cache:
        type: emptyDir
        globalMounts:
          - path: /cache

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      dri:
        hostPath: /dev/dri
        type: hostPath
