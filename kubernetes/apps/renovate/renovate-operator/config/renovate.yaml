---
# yaml-language-server: $schema=https://github.com/mogenius/renovate-operator/raw/refs/heads/main/charts/renovate-operator/crds/renovate-operator.mogenius.com_renovatejobs.yaml
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
  annotations:
    reloader.stakater.com/auto: "true"
    secret.reloader.stakater.com/reload: "renovate-s3"
spec:
  # discoveryFilter:
  image: ghcr.io/renovatebot/renovate:44.247.2@sha256:5b777fc44b9736e4bd656ba7c54dc54fb76290b2701983c0bb06f16df0c54ad5
  parallelism: 10
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  schedule: "@hourly"
  secretRef: renovate-secret
  serviceAccount:
    name: renovate-job
    automountServiceAccountToken: false
  skipForks: false
  webhook:
    enabled: true
  provider:
    name: github
  extraEnv:
    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": [
            'config:recommended'
          ]
        }
    - name: RENOVATE_ALLOW_PLUGINS
      value: "true"
    - name: RENOVATE_DEPENDENCY_DASHBOARD
      value: "true"

    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: renovate-secret
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: renovate-secret
          key: AWS_SECRET_ACCESS_KEY
    # The package cache: database 1 of the Discus cluster, through the Service.
    # Renovate does not use TLS to the nodes that a cluster names, so the URL
    # is not rediss+cluster://. Kubernetes puts the token into the URL. The
    # token has only letters and digits, so it needs no URL encoding.
    - name: DISCUS_TOKEN
      valueFrom:
        secretKeyRef:
          name: renovate-discus-token
          key: token
    - name: RENOVATE_REDIS_URL
      value: rediss://:$(DISCUS_TOKEN)@renovate-discus.renovate.svc.cluster.local:6379/1
    # Node adds this CA to its trust store, so the jobs accept the Discus
    # certificate (../app/discus-tls.yaml).
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/ssl/internal/ca.crt
  extraVolumes:
    - name: internal-ca
      configMap:
        name: internal-ca
  extraVolumeMounts:
    - name: internal-ca
      mountPath: /etc/ssl/internal
      readOnly: true
