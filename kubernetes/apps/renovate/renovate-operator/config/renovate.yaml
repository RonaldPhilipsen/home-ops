---
# yaml-language-server: $schema=https://github.com/mogenius/renovate-operator/raw/refs/heads/main/charts/renovate-operator/crds/renovate-operator.mogenius.com_renovatejobs.yaml
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
  annotations:
    reloader.stakater.com/auto: "true"
    secret.reloader.stakater.com/reload: "renovate-s3"
spec:
  # discoveryFilter:
  image: ghcr.io/renovatebot/renovate:44.108.2@sha256:9a02c0e89a1337fed22b40b01a0c9b212e947eff37e8a1bd0d3696bfe5a0b344
  parallelism: 10
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  schedule: "@hourly"
  secretRef: renovate-secret
  skipForks: true
  webhook:
    enabled: true
  provider:
    name: github
  extraEnv:
    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": [
            'config:recommended'
          ]
        }
    - name: RENOVATE_ALLOW_PLUGINS
      value: "true"
    - name: RENOVATE_DEPENDENCY_DASHBOARD
      value: "true"

    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: renovate-secret
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: renovate-secret
          key: AWS_SECRET_ACCESS_KEY
