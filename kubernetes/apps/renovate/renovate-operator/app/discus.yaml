---
# Discus cluster for the operator: three nodes, every key on three owners.
# The operator is a cluster client on port 6380 and keeps its sessions and the
# logs of finished runs in database 0. The Renovate jobs use the Service on
# 6379 and keep their cache in database 1. The data is in memory only, so a
# restart of all three nodes loses it. Renovate then rebuilds its cache on the
# next run.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-discus
spec:
  interval: 1h
  timeout: 10m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 0.6.2
      url: oci://ghcr.io/ronaldphilipsen/charts/discus
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  values:
    replicaCount: 3
    # The cluster client port. A client reads the slot table from it and
    # sends each command to the node that owns the key. The replies name each
    # pod as <pod IP with dashes>.renovate-discus-peers.renovate.svc.cluster.local,
    # which the wildcard name of the client certificate covers (discus-tls.yaml).
    clusterClients:
      enabled: true
      port: 6380
    # Database 2 held the operator logs before the operator became a cluster
    # client. Nothing reads it now. A lower count needs the steps in the
    # Discus docs/cluster.md, so the count stays at 3.
    databases: 3
    cluster:
      tls:
        secretName: renovate-discus-cluster
      san:
        enabled: true
    clientTls:
      secretName: renovate-discus-client
    authPolicy: all:tls,shared_token
    settings:
      reads:
        # A login writes a session and the next request reads it, maybe on
        # another node. Reads from the primary always see that write.
        fromReplicas: false
    # Metrics and traces go to the gateway collector, which forwards them to
    # VictoriaMetrics. The dashboard reads these metrics.
    otel:
      enabled: true
      endpoint: http://gateway-collector.observability.svc.cluster.local:4317
    # The dashboard has a namespace variable, so this one copy also shows
    # other Discus clusters that export metrics.
    grafanaDashboard:
      enabled: true
      instanceSelector:
        matchLabels:
          grafana.internal/instance: grafana
    extraEnv:
      - name: DISCUS_SHARED_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-discus-token
            key: token
    extraArgs:
      - --shared-token=$(DISCUS_SHARED_TOKEN)
    # The store budget is 75% of the memory limit. One CPU gives one worker.
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
