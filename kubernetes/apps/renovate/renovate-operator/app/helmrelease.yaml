---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
  annotations:
    reloader.stakater.com/auto: "true"
    secret.reloader.stakater.com/reload: "renovate-s3"
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 6.6.0
      url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
  values:
    fullnameOverride: *app

    authorization:
      enabled: false
    config:
      forwardCacheToJobs: true
      forwardS3CacheToJobs: true
    rbac:
      ownNamespaceOnly: true
    policy:
      allowedServiceAccounts:
        - renovate-job
    webhook:
      enabled: true

    valkey:
      enabled: true
      # ACL auth for the default user. The password comes from the
      # in-cluster generated secret in valkey-auth.yaml. passwordKey is set
      # explicitly: the operator, the exporter and the init script use
      # different defaults otherwise.
      auth:
        enabled: true
        usersExistingSecret: renovate-operator-valkey-users
        aclUsers:
          default:
            passwordKey: default-password
            permissions: "~* &* +@all"
      dataStorage:
        enabled: true
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    s3:
      bucket: "renovate"
      endpoint: "http://172.16.20.7:3900/"
      forcePathStyle: true

    telemetry:
      enabled: true
      endpoint: "http://gateway-collector.observability.svc.cluster.local:4317"
      forwardToJobs: true
      jobEndpoint: "http://gateway-collector.observability.svc.cluster.local:4318"
