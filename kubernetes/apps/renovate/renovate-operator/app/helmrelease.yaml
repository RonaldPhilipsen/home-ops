---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
spec:
  interval: 1h
  # The operator stops at startup when its key-value store is down.
  dependsOn:
    - name: renovate-discus
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 7.0.0
        digest: sha256:cb8f083de9eb9e64af50ffadf8a7c62a3f8f41014d465da7f38effe15fdc8ad3
      url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
  values:
    fullnameOverride: *app

    # Reloader reads these annotations on the Deployment, not on this
    # HelmRelease. The operator reads the Discus password (discus-token.yaml)
    # and the S3 keys only at its start, so it must restart after a change of
    # either Secret.
    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
        secret.reloader.stakater.com/reload: "renovate-s3"

    authorization:
      enabled: false
    config:
      # The forwarded URL would be rediss+cluster://. Renovate 44.239.1 does
      # not use TLS to the nodes that a cluster names, and a job then stops
      # at its start. The jobs get their own URL in ../config/renovate.yaml.
      forwardCacheToJobs: false
      forwardS3CacheToJobs: true
    rbac:
      ownNamespaceOnly: true
    policy:
      allowedServiceAccounts:
        - renovate-job
    webhook:
      enabled: true

    # The Discus cluster in discus.yaml. The operator connects to the cluster
    # client port, reads the slot table, and then talks to each node directly.
    # A cluster has only database 0, so the sessions and the logs share it.
    externalKeyValueStore:
      host: renovate-discus.renovate.svc.cluster.local
      port: 6380
      useTls: true
      cluster: true
      existingSecret:
        name: renovate-discus-token
        passwordKey: token
    # Go reads its whole trust store from SSL_CERT_FILE. The bundle holds the
    # public CAs and the internal CA that signs the Discus certificate.
    extraEnv:
      - name: SSL_CERT_FILE
        value: /etc/ssl/internal/ca-certificates.crt
    extraVolumes:
      - name: internal-ca-bundle
        configMap:
          name: internal-ca-bundle
    extraVolumeMounts:
      - name: internal-ca-bundle
        mountPath: /etc/ssl/internal
        readOnly: true
    s3:
      bucket: "renovate"
      endpoint: "http://172.16.20.7:3900/"
      forcePathStyle: true

    telemetry:
      enabled: true
      endpoint: "http://gateway-collector.observability.svc.cluster.local:4317"
      forwardToJobs: true
      jobEndpoint: "http://gateway-collector.observability.svc.cluster.local:4318"
