---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
  annotations:
    reloader.stakater.com/auto: "true"
    secret.reloader.stakater.com/reload: "renovate-s3"
spec:
  interval: 1h
  # The operator stops at startup when its key-value store is down.
  dependsOn:
    - name: renovate-discus
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 6.6.0
      url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
  values:
    fullnameOverride: *app

    authorization:
      enabled: false
    config:
      forwardCacheToJobs: true
      forwardS3CacheToJobs: true
    rbac:
      ownNamespaceOnly: true
    policy:
      allowedServiceAccounts:
        - renovate-job
    webhook:
      enabled: true

    # The Discus cluster in discus.yaml. With a host, the operator uses
    # database 0 for sessions, 1 for the Renovate cache, and 2 for logs, and
    # forwards a rediss:// URL for database 1 to the jobs.
    externalKeyValueStore:
      host: renovate-discus.renovate.svc.cluster.local
      port: 6379
      useTls: true
      existingSecret:
        name: renovate-discus-token
        passwordKey: token
    # Go reads its whole trust store from SSL_CERT_FILE. The bundle holds the
    # public CAs and the internal CA that signs the Discus certificate.
    extraEnv:
      - name: SSL_CERT_FILE
        value: /etc/ssl/internal/ca-certificates.crt
    extraVolumes:
      - name: internal-ca-bundle
        configMap:
          name: internal-ca-bundle
    extraVolumeMounts:
      - name: internal-ca-bundle
        mountPath: /etc/ssl/internal
        readOnly: true
    s3:
      bucket: "renovate"
      endpoint: "http://172.16.20.7:3900/"
      forcePathStyle: true

    telemetry:
      enabled: true
      endpoint: "http://gateway-collector.observability.svc.cluster.local:4317"
      forwardToJobs: true
      jobEndpoint: "http://gateway-collector.observability.svc.cluster.local:4318"
