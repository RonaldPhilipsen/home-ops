---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
  annotations:
    reloader.stakater.com/auto: "true"
    secret.reloader.stakater.com/reload: "renovate-s3"
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    fullnameOverride: *app

    config:
      forwardCacheToJobs: true
      forwardS3CacheToJobs: true
    rbac:
      ownNamespaceOnly: true
    webhook:
      enabled: true

    valkey:
      enabled: true
      auth:
        enabled: false
      dataStorage:
        enabled: true
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    s3:
      bucket: "renovate"
      endpoint: "http://172.16.20.7:3900/"
      forcePathStyle: true


    telemetry:
      enabled: true
      endpoint: "http://gateway-collector.observability.svc.cluster.local:4317"
      forwardToJobs: true
      jobEndpoint: "http://gateway-collector.observability.svc.cluster.local:4318"
