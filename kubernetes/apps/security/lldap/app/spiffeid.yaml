---
# SPIFFE identity for the LLDAP pod: SVID with CN=lldap (the Postgres role)
# and URI SAN spiffe://spiffe.rphilipsen.nl/ns/security/sa/lldap.
# Cluster-scoped: the hardened chart only ships the ClusterSPIFFEID CRD.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: lldap
spec:
  # the controller manager only watches its own class (watchClassless: false)
  className: spiffe-spire
  spiffeIDTemplate: "spiffe://spiffe.rphilipsen.nl/ns/security/sa/lldap"
  dnsNameTemplates:
    - lldap
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: security
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lldap
