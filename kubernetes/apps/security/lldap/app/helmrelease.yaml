---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
spec:
  interval: 15m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  # app-template's schema allows neither pod.volumes nor container
  # volumeMounts, so the db-bridge volumes and their mounts are added here
  # (strategic merge: containers merge by name, volumes by name).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: lldap
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: lldap
              spec:
                template:
                  spec:
                    volumes:
                      # SPIRE agent Workload API socket
                      - name: spiffe
                        csi:
                          driver: csi.spiffe.io
                          readOnly: true
                      # SVID files written by spiffe-helper, read by the bridge
                      - name: svid
                        emptyDir: {}
                      # CNPG server CA (published by the spire-ca-bridge CronJob)
                      - name: cnpg-ca
                        secret:
                          secretName: cnpg-server-ca
                    initContainers:
                      - name: db-bridge
                        volumeMounts:
                          - name: spiffe
                            mountPath: /run/spiffe
                            readOnly: true
                          - name: svid
                            mountPath: /spiffe
                          - name: cnpg-ca
                            mountPath: /cnpg-ca
                            readOnly: true
  values:
    controllers:
      lldap:
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [1000]
            seccompProfile: { type: RuntimeDefault }
        initContainers:
          # SPIFFE-aware Postgres bridge: spiffe-helper fetches/rotates the
          # SVID (CN=lldap); the bridge serves LLDAP on loopback and presents
          # the SVID to the CNPG rw service (pg_hba "cert"). No DB password
          # involved. (volumeMounts are added by the postRenderer: the chart
          # schema does not allow them in values)
          db-bridge:
            # native sidecar: the kubelet starts it before the app and
            # starts the app only after the startup probe passes (the
            # bridge listens only once it has the SVID), then keeps it
            # running next to the app
            restartPolicy: Always
            image:
              repository: ghcr.io/ronaldphilipsen/db-bridge
              tag: 1.4.0@sha256:eae8ae4385aa065f0e4a2830587bc1a595a165a8b2acb88eeb2de0bfbb3f5772
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  periodSeconds: 2
                  timeoutSeconds: 3
                  failureThreshold: 45
              # the bridge listens on loopback only, so a kubelet tcpSocket
              # probe (which dials the pod IP) can never work; ask the binary
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          main:
            image:
              repository: ghcr.io/lldap/lldap
              tag: v0.6.3-alpine-rootless
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            envFrom:
              - secretRef:
                  name: lldap-secret
            env:
              UID: "2000"
              GID: "2000"
    service:
      main:
        controller: lldap
        ports:
          http:
            port: 3890
            primary: true
          web:
            protocol: TCP
            port: &port 17170
    route:
      main:
        hostnames: ["ldap.rphilipsen.nl"]
        parentRefs:
          - name: internal
            namespace: kube-system
            port: 443
        rules:
          - backendRefs:
              - name: lldap
                port: *port
    persistence:
      config:
        existingClaim: lldap
        # advancedMounts: scope the LLDAP data to the main container only
        advancedMounts:
          lldap:
            main:
              - path: /data
