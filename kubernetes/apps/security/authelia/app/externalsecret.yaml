---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authelia-config
spec:
  target:
    name: *name
    template:
      templateFrom:
        - target: Data
          configMap:
            name: authelia-config-tpl
            items:
              - key: configuration.yaml
                templateAs: Values
  dataFrom:
    - extract:
        key: authelia
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: onepassword-connect
    # PGADMIN_OAUTH_CLIENT_SECRET, generated next to pgAdmin in database
    - extract:
        key: pgadmin-oidc
      sourceRef:
        storeRef:
          kind: SecretStore
          name: pgadmin-database
    # CONTINUWUITY_OAUTH_CLIENT_SECRET, generated next to continuwuity in default
    - extract:
        key: continuwuity-oidc
      sourceRef:
        storeRef:
          kind: SecretStore
          name: continuwuity-default
