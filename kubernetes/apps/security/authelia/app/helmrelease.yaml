---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
spec:
  interval: 1h
  timeout: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
              name: authelia
            patch: |
              - op: add
                path: /spec/rules/0/filters
                value:
                  - type: RequestHeaderModifier
                    requestHeaderModifier:
                      set:
                        - name: X-Forwarded-Proto
                          value: https
          # app-template's schema allows neither pod.volumes nor container
          # volumeMounts, so the db-bridge volumes and their mounts are added
          # here (strategic merge: containers and volumes merge by name).
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: authelia
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authelia
              spec:
                template:
                  spec:
                    volumes:
                      # SPIRE agent Workload API socket
                      - name: spiffe
                        csi:
                          driver: csi.spiffe.io
                          readOnly: true
                      # SVID files written by spiffe-helper, read by the bridge
                      - name: svid
                        emptyDir: {}
                      # CNPG server CA (published by the spire-ca-bridge CronJob)
                      - name: cnpg-ca
                        secret:
                          secretName: cnpg-server-ca
                    initContainers:
                      - name: db-bridge
                        volumeMounts:
                          - name: spiffe
                            mountPath: /run/spiffe
                            readOnly: true
                          - name: svid
                            mountPath: /spiffe
                          - name: cnpg-ca
                            mountPath: /cnpg-ca
                            readOnly: true
  values:
    controllers:
      authelia:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
        initContainers:
          # SPIFFE-aware Postgres bridge: spiffe-helper fetches/rotates the
          # SVID (CN=authelia); the bridge serves Authelia on loopback and
          # presents the SVID to the CNPG rw service (pg_hba "cert"). No DB
          # password involved. (volumeMounts are added by the postRenderer:
          # the chart schema does not allow them in values)
          db-bridge:
            # native sidecar: the kubelet starts it before the app and
            # starts the app only after the startup probe passes (the
            # bridge listens only once it has the SVID), then keeps it
            # running next to the app
            restartPolicy: Always
            image:
              repository: ghcr.io/ronaldphilipsen/db-bridge
              tag: 1.4.0@sha256:eae8ae4385aa065f0e4a2830587bc1a595a165a8b2acb88eeb2de0bfbb3f5772
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  periodSeconds: 2
                  timeoutSeconds: 3
                  failureThreshold: 45
              # the bridge listens on loopback only, so a kubelet tcpSocket
              # probe (which dials the pod IP) can never work; ask the binary
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - db-bridge
                      - -health
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            # the pod has no securityContext; do not run the bridge as root
            securityContext:
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          main:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.28
            resources:
              requests:
                cpu: 1m
                memory: 50Mi
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      main:
        controller: authelia
        ports:
          https:
            port: 9091
    route:
      main:
        labels:
          expose: public
        hostnames: ["auth.rphilipsen.nl"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: authelia
                port: 9091
    persistence:
      tls:
        type: secret
        name: authelia-tls
        defaultMode: 0440
        advancedMounts:
          authelia:
            main:
              - path: /tls
                readOnly: true
      config:
        enabled: true
        type: secret
        name: authelia-config
        # advancedMounts: keep Authelia's config (and its secrets) out of the
        # db-bridge sidecar
        advancedMounts:
          authelia:
            main:
              - path: /config/configuration.yml
                subPath: configuration.yaml
                readOnly: true
