---
# yaml-language-server: $schema=https://www.authelia.com/schemas/latest/json-schema/configuration.json

# This is sort of a template file for Authelia configurations.
# It will be deployed as `ConfigMap` then used as template by `external-secrets` to create a `Secret`.
# Flux and External Secrets both substitute values during deployment.
theme: auto
# Extra trusted CAs: the internal CA, which issues the Discus client
# certificate (helmrelease.yaml: persistence internal-ca)
certificates_directory: /internal-ca
server:
  address: tcp://0.0.0.0:9091
  # native HTTPS with a certificate from the internal CA (tls.yaml); the
  # gateway and Trek's OIDC proxy verify it against the internal CA
  tls:
    certificate: /tls/tls.crt
    key: /tls/tls.key
  disable_healthcheck: true
log:
  level: debug
totp:
  disable: false
webauthn:
  disable: false
  enable_passkey_login: false
  display_name: "Authelia"
  attestation_conveyance_preference: "indirect"
  timeout: "60 seconds"
  selection_criteria:
    discoverability: "preferred"
    user_verification: "preferred"
storage:
  encryption_key: "{{ .STORAGE_ENCRYPTION_KEY }}"
  postgres:
    # local db-bridge sidecar: it presents the pod's SPIFFE SVID (CN=authelia)
    # to CNPG, which authenticates it with pg_hba "cert". Authelia requires
    # a password value; nothing checks it.
    address: tcp://127.0.0.1:5432
    database: "{{ .POSTGRES_DBNAME }}"
    username: "{{ .POSTGRES_USER }}"
    password: "unused-spiffe-cert-auth"
notifier:
  disable_startup_check: true
  smtp:
    address: "smtp://{{ .SMTP_HOST }}:{{ .SMTP_PORT }}"
    timeout: "5s"
    username: "{{ .SMTP_USERNAME }}"
    password: "{{ .SMTP_PASSWORD }}"
    sender: "Authelia <webmaster@rphilipsen.nl>"
    identifier: "localhost"
    subject: "[Authelia] {title}"
    startup_check_address: "test@rphilipsen.nl"
    disable_require_tls: false
    disable_starttls: false
    disable_html_emails: false
ntp:
  address: udp://time.cloudflare.com:123
  version: 4
  max_desync: 3s
  disable_startup_check: false
  disable_failure: false
identity_validation:
  reset_password:
    jwt_secret: "{{ .RESET_PASSWORD_JWT }}"
authentication_backend:
  password_reset:
    disable: false
  refresh_interval: 1m
  ldap:
    implementation: lldap
    address: "{{ .LLDAP_HOST }}"
    timeout: 5s
    start_tls: false
    base_dn: dc=rphilipsen,dc=nl
    user: uid=authelia_bind,ou=people,dc=rphilipsen,dc=nl
    password: "{{ .LLDAP_PASSWORD }}"
access_control:
  default_policy: deny
  networks:
    - name: internal
      networks:
        - 10.244.0.0/16
        - 10.10.10.0/24
        - 10.0.8.0/24
        - 192.168.10.0/24
        - 192.168.200.0/24
  rules:
    # OIDC protocol endpoints are authenticated at the protocol level
    # (client credentials, access tokens, interactive 2FA), so no IP-based
    # trust is needed for in-cluster OIDC clients.
    - domain: "auth.rphilipsen.nl"
      resources:
        - "^/\\.well-known/"
        - "^/oidc/"
      policy: bypass
    - domain: "*.rphilipsen.nl"
      policy: bypass
      networks:
        - internal
    - domain: "*.rphilipsen.nl"
      policy: two_factor
session:
  secret: "{{ .SESSION_SECRET }}"
  name: authelia_session
  expiration: 1h
  inactivity: 15m
  remember_me: 1M
  cookies:
    - domain: rphilipsen.nl
      authelia_url: https://auth.rphilipsen.nl
      default_redirection_url: https://rphilipsen.nl
  redis:
    # Discus cluster (../discus.yaml). Any node serves any key, so the RENAME
    # that regenerates a session at login works across slots.
    host: authelia-discus.security.svc.cluster.local
    port: 6379
    password: "{{ .AUTHELIA_VALKEY_PASSWORD }}"
    database_index: 0
    tls:
      server_name: authelia-discus.security.svc.cluster.local
      minimum_version: TLS1.2
regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m
identity_providers:
  oidc:
    hmac_secret: "{{ .OIDC_HMAC_SECRET }}"
    claims_policies:
      default:
        id_token:
          - rat
          - groups
          - email
          - email_verified
          - alt_emails
          - preferred_username
          - name
    scopes: {}
    jwks:
      - key: |
          {{- .OIDC_JWKS_PRIVKEY | b64dec | nindent 10 }}
        certificate_chain: |
          {{- .OIDC_JWKS_CERT | b64dec | nindent 10 }}
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
      allowed_origins_from_client_redirect_uris: true
    clients:
      - client_id: "{{ .GRAFANA_OAUTH_CLIENT_ID }}"
        client_name: Grafana
        client_secret: "{{ .GRAFANA_OAUTH_CLIENT_SECRET }}"
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        scopes:
          - "openid"
          - "profile"
          - "groups"
          - "email"
        redirect_uris:
          - "https://grafana.rphilipsen.nl/login/generic_oauth"
        token_endpoint_auth_method: client_secret_post
        userinfo_signed_response_alg: none
      - client_id: "{{ .HASS_OAUTH_CLIENT_ID }}"
        client_name: "Home Assistant"
        client_secret: "{{ .HASS_OAUTH_CLIENT_SECRET }}"
        public: false
        require_pkce: true
        pkce_challenge_method: "S256"
        authorization_policy: "two_factor"
        redirect_uris:
          - "https://hass.rphilipsen.nl/auth/oidc/callback"
          - "https://172.16.10.24/auth/oidc/callback"
        scopes:
          - "openid"
          - "profile"
          - "groups"
        id_token_signed_response_alg: "RS256"
        token_endpoint_auth_method: "client_secret_post"
      - client_id: "{{ .IMMICH_OAUTH_CLIENT_ID }}"
        client_name: "Immich"
        client_secret: "{{ .IMMICH_OAUTH_CLIENT_SECRET }}"
        public: false
        require_pkce: true
        pkce_challenge_method: "S256"
        authorization_policy: "two_factor"
        redirect_uris:
          - "https://photos.rphilipsen.nl/auth/login"
          - "https://photos.rphilipsen.nl/user-settings"
          - "app.immich:///oauth-callback"
        scopes:
          - "openid"
          - "profile"
          - "email"
        response_types:
          - "code"
        grant_types:
          - "authorization_code"
        id_token_signed_response_alg: "RS256"
        userinfo_signed_response_alg: "RS256"
        token_endpoint_auth_method: "client_secret_post"
      # pgAdmin (database/pgadmin). pgAdmin itself also requires the
      # lldap_admin group (OAUTH2_ADDITIONAL_CLAIMS).
      - client_id: pgadmin
        client_name: pgAdmin
        client_secret: "{{ .PGADMIN_OAUTH_CLIENT_SECRET }}"
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        scopes:
          - "openid"
          - "profile"
          - "groups"
          - "email"
        redirect_uris:
          - "https://pgadmin.rphilipsen.nl/oauth2/authorize"
        token_endpoint_auth_method: client_secret_basic
        userinfo_signed_response_alg: none
      # continuwuity (default/continuwuity). It reads the claims from the ID
      # token only, so this client needs the default claims policy.
      - client_id: continuwuity
        client_name: Matrix
        client_secret: "{{ .CONTINUWUITY_OAUTH_CLIENT_SECRET }}"
        public: false
        authorization_policy: two_factor
        pre_configured_consent_duration: 1y
        claims_policy: default
        require_pkce: true
        pkce_challenge_method: "S256"
        scopes:
          - "openid"
          - "profile"
          - "email"
        redirect_uris:
          - "https://matrix.rphilipsen.nl/_continuwuity/oidc/complete"
        response_types:
          - "code"
        grant_types:
          - "authorization_code"
        id_token_signed_response_alg: "RS256"
        token_endpoint_auth_method: client_secret_basic
      - client_id: "{{ .TREK_OAUTH_CLIENT_ID }}"
        client_name: "TREK"
        client_secret: "{{ .TREK_OAUTH_CLIENT_SECRET }}"
        public: false
        authorization_policy: "two_factor"
        redirect_uris:
          - "https://trek.rphilipsen.nl/api/auth/oidc/callback"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "groups"
        token_endpoint_auth_method: "client_secret_post"
      # - client_id: "{{ .JELLYFIN_OAUTH_CLIENT_ID }}"
      #   client_name: Jellyfin
      #   client_secret: "{{ .JELLYFIN_OAUTH_CLIENT_SECRET }}"
      #   public: false
      #   authorization_policy: 'two_factor'
      #   require_pkce: true
      #   pkce_challenge_method: 'S256'
      #   pre_configured_consent_duration: 1y
      #   scopes:
      #     - 'openid'
