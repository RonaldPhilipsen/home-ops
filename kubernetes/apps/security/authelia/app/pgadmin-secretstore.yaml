---
# The service account of Authelia's SecretStores. Each store reads one OIDC
# client secret that is generated next to its app, in another namespace. A
# Role next to each secret allows this account to get that one secret only.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authelia-secret-reader
---
# Reads the pgAdmin OIDC client secret (secret pgadmin-oidc, generated in the
# database namespace next to pgAdmin) for the authelia-config template. The
# Role is in kubernetes/apps/database/pgadmin/app/secrets.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pgadmin-database
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authelia-secret-reader
