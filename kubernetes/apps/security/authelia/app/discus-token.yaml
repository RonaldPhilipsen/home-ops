---
# The password of the Discus cluster (discus.yaml). Generated in-cluster
# once (refreshInterval "0": never regenerated), so it is not in git or
# 1Password. Authelia reads the token key as a file (helmrelease.yaml). The
# Discus nodes read the users.acl key: an ACL file that gives the user
# "default" this password, as a SHA-256 hash, and every right. A client
# sends the password without a username.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authelia-discus-token
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-discus-token
spec:
  refreshInterval: "0"
  target:
    name: authelia-discus-token
    template:
      engineVersion: v2
      data:
        token: "{{ .password }}"
        users.acl: |
          user default on allkeys +@all #{{ .password | sha256sum }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authelia-discus-token
