---
# Reads the Authelia Valkey password (secret valkey-authelia, generated in
# the database namespace next to Valkey) for the authelia-config template.
# The Role in kubernetes/apps/database/valkey/cluster/authelia-user.yaml
# allows this service account to get that one secret only.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authelia-valkey-reader
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: valkey-database
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authelia-valkey-reader
