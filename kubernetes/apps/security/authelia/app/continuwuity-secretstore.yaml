---
# Reads the continuwuity OIDC client secret (secret continuwuity-oidc,
# generated in the default namespace next to continuwuity) for the
# authelia-config template. The Role in
# kubernetes/apps/default/continuwuity/app/oidc.yaml allows this service
# account to get that one secret only.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: continuwuity-default
spec:
  provider:
    kubernetes:
      remoteNamespace: default
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authelia-valkey-reader
