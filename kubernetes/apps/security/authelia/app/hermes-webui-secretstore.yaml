---
# Reads the hermes-webui OIDC client secret (secret hermes-webui-oidc,
# generated in the ai namespace next to hermes-webui) for the authelia-config
# template. The Role is in kubernetes/apps/ai/hermes-webui/app/secrets.yaml.
# The service account authelia-secret-reader is in pgadmin-secretstore.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: hermes-webui-ai
spec:
  provider:
    kubernetes:
      remoteNamespace: ai
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authelia-secret-reader
