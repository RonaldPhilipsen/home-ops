---
# Standalone Valkey for Authelia's sessions. Authelia cannot use the shared
# ValkeyCluster (database namespace): at login it renames the session key to
# a new random ID, and cluster mode rejects a RENAME across hash slots with
# CROSSSLOT, even with one shard. Sessions are in memory only, so a restart
# of this pod logs users out.
#
# The password is the generated secret valkey-authelia (database namespace),
# read through the valkey-database SecretStore.
# yaml-language-server: $schema=https://schemas.budimanjojo.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-valkey-auth
spec:
  target:
    name: authelia-valkey-auth
  dataFrom:
    - extract:
        key: valkey-authelia
      sourceRef:
        storeRef:
          kind: SecretStore
          name: valkey-database
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia-valkey
spec:
  interval: 1h
  timeout: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  values:
    controllers:
      authelia-valkey:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
        containers:
          main:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
            args:
              - valkey-server
              - --requirepass
              - $(REDISCLI_AUTH)
              - --save
              - ""
              - --appendonly
              - "no"
              - --maxmemory
              - 64mb
              - --maxmemory-policy
              - volatile-lru
            env:
              # valkey-cli reads REDISCLI_AUTH, so the probes can log in
              REDISCLI_AUTH:
                valueFrom:
                  secretKeyRef:
                    name: authelia-valkey-auth
                    key: AUTHELIA_VALKEY_PASSWORD
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec: &ping
                    command:
                      - sh
                      - -c
                      - valkey-cli ping | grep -q PONG
                  periodSeconds: 2
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: *ping
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *ping
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      authelia-valkey:
        controller: authelia-valkey
        ports:
          valkey:
            port: 6379
