---
# Backend TLS for Authelia (server.tls in config/configuration.yaml: 9091
# serves HTTPS only). Issued by the internal CA; Authelia reads the PEM
# files at startup, and Reloader restarts it on renewal.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authelia-tls
spec:
  secretName: authelia-tls
  dnsNames:
    - authelia.security.svc.cluster.local
    - authelia.security.svc
    - authelia.security
  duration: 2160h # 90d
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: internal-ca
---
# The gateway connects to Authelia over HTTPS and verifies it against the
# internal CA (ConfigMap internal-ca).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/backendtlspolicy_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: authelia
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: authelia
      sectionName: https
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: internal-ca
    hostname: authelia.security.svc.cluster.local
