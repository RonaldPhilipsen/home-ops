---
# Discus cluster for Authelia's sessions: three nodes, every session on three
# owners, so a node loss keeps users signed in. Sessions are in memory only, so
# a restart of all three nodes signs out every user.
#
# The password is in the generated secret authelia-discus-token
# (discus-token.yaml). The nodes read its ACL file, and Authelia reads the
# password from the same secret (helmrelease.yaml).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia-discus
spec:
  interval: 1h
  timeout: 10m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 0.8.0
        digest: sha256:a9f64d5e5e82bf49a96a9400b8dc7c99e531851c4eb27fa711245080e25483a8
      url: oci://ghcr.io/ronaldphilipsen/charts/discus
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  values:
    replicaCount: 3
    # Authelia uses the Service on 6379 and needs no cluster client port.
    clusterClients:
      enabled: false
    cluster:
      tls:
        secretName: authelia-discus-cluster
      san:
        enabled: true
    clientTls:
      secretName: authelia-discus-client
    # One password for every client: the user "default" of the ACL file
    # (discus-token.yaml). The node reads the file again after the Secret
    # changes.
    authPolicy: all:password
    aclFile:
      secretName: authelia-discus-token
      key: users.acl
    # The budgets follow "Run Authelia on Discus" in the Discus cluster guide.
    settings:
      budget:
        # A write hold must stay below the 3 s read timeout of Authelia.
        holdMs: 1500
        # A session read makes one attempt on the primary and has no replica
        # fallback.
        forwardReadMs: 200
    # Metrics and traces go to the gateway collector, which forwards them to
    # VictoriaMetrics. The dashboard of the renovate-discus release has a
    # namespace variable, so it also shows this cluster.
    otel:
      enabled: true
      endpoint: http://gateway-collector.observability.svc.cluster.local:4317
    # Authelia names each session key with this prefix. A read of a session
    # goes to the primary and returns the latest write.
    extraArgs:
      - --primary-read-prefix=authelia-session
    # The store budget is 75% of the memory limit. One CPU gives one worker.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 256Mi
