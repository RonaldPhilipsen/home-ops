---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kodi
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: kodi
  values:
    controllers:
      kodi:
        type: statefulset
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
        containers:
          pipewire:
            enabled: true
            image:
              repository: ghcr.io/m00nwtchr/pipewire
              tag: rolling
            securityContext:
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              privileged: false

          weston:
            enabled: true
            image:
              repository: ghcr.io/m00nwtchr/weston
              tag: rolling
            env:
              - name: WAYLAND_DISPLAY
                value: wayland-1
              - name: WESTON_SHELL
                value: desktop-shell.so
            args:
              - --socket=$(WAYLAND_DISPLAY)
              - --continue-without-input
            resources:
              limits:
                nvidia.com/gpu-all: "1"
              requests:
                nvidia.com/gpu-all: "1"
            securityContext:
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              privileged: false
          kodi:
            enabled: true
            image:
              repository: ghcr.io/m00nwtchr/kodi
              tag: rolling
            env:
              - name: WAYLAND_DISPLAY
                value: wayland-1
              - name: PIPEWIRE_REMOTE
                value: pipewire-0
              - name: HOME
                value: /data
            args:
              - --standalone
              - --fullscreen
              - --audio-backend=pipewire
              - --logging=console
            securityContext:
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              privileged: false
    volumeMounts:
      - name: runtime
        mountPath: /tmp/run
      - name: snd
        mountPath: /dev/snd
      - name: cache
        mountPath: /cache
      - name: kodi-home
        mountPath: /data
      - name: seatd
        mountPath: /run/seatd.sock
    service:
      main:
        ports:
          http:
            port: 8080
    ingress:
      main:
        enabled: false
    persistence:
      config:
        enabled: true
        type: emptyDir
      cache:
        enabled: true
        type: emptyDir
      runtime:
        enabled: true
        type: emptyDir
      kodi-home:
        enabled: true
        type: emptyDir
      snd:
        enabled: true
        type: hostPath
        hostPath: /dev/snd
      seatd:
        enabled: true
        type: hostPath
        hostPath: /run/seatd.sock
    securityContext:
      runAsUser: 1000
      runAsGroup: 100
      fsGroup: 100
      fsGroupChangePolicy: "OnRootMismatch"
      supplementalGroups:
        - 17 # audio
        - 987 # seat
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: "OnRootMismatch"
      supplementalGroups:
        - 17 # audio
        - 987 # seat
    nodeSelector:
      org.democratic-csi.topology/node: k8s-neo-beta

