---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kodi
spec:
  interval: 10m
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
  values:
    controllers:
      kodi:
        type: statefulset
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
        containers:
          pipewire:
            enabled: true
            image:
              repository: ghcr.io/m00nwtchr/pipewire
              tag: rolling@sha256:a665d64a1ac819dc5ed61cc0d7cde619eb5cb10b3eb844476da223dc0d9ed74b
            securityContext:
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              privileged: false

          weston:
            enabled: true
            image:
              repository: ghcr.io/m00nwtchr/weston
              tag: rolling@sha256:f4f38f6992c1dc855bd17f1cf913b85343ae3bd4d211618ab62304e0e20c6d09
            env:
              - name: WAYLAND_DISPLAY
                value: wayland-1
              - name: WESTON_SHELL
                value: desktop-shell.so
            args:
              - --socket=$(WAYLAND_DISPLAY)
              - --continue-without-input
            securityContext:
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              privileged: false
          kodi:
            enabled: true
            image:
              repository: ghcr.io/m00nwtchr/kodi
              tag: rolling@sha256:5ba40afacbfe5bfc57dadac1c71f0bdf9b5519f6ef19b7ff3529b9bb6e378495
            env:
              - name: WAYLAND_DISPLAY
                value: wayland-1
              - name: PIPEWIRE_REMOTE
                value: pipewire-0
              - name: HOME
                value: /data
            args:
              - --standalone
              - --fullscreen
              - --audio-backend=pipewire
              - --logging=console
            securityContext:
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              privileged: false
    volumeMounts:
      - name: runtime
        mountPath: /tmp/run
      - name: snd
        mountPath: /dev/snd
      - name: cache
        mountPath: /cache
      - name: kodi-home
        mountPath: /data
      - name: seatd
        mountPath: /run/seatd.sock
      - name: system-bus
        mountPath: /run/dbus/system_bus_socket
    service:
      main:
        ports:
          http:
            port: 8080
    ingress:
      main:
        enabled: false
    persistence:
      config:
        enabled: true
        type: emptyDir
      cache:
        enabled: true
        type: emptyDir
      runtime:
        enabled: true
        type: emptyDir
      kodi-home:
        enabled: true
        type: emptyDir
      snd:
        enabled: true
        type: hostPath
        hostPath: /dev/snd
      seatd:
        enabled: true
        type: hostPath
        hostPath: /run/seatd.sock
      system-bus:
        enabled: true
        type: hostPath
        hostPath: /run/dbus/system_bus_socket
    securityContext:
      runAsUser: 1000
      runAsGroup: 100
      fsGroup: 100
      fsGroupChangePolicy: "OnRootMismatch"
      supplementalGroups:
        - 17 # audio
        - 987 # seat
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: "OnRootMismatch"
      supplementalGroups:
        - 17 # audio
        - 987 # seat
    nodeSelector:
      org.democratic-csi.topology/node: k8s-neo-beta

