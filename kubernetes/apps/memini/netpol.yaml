---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-and-local-ingress
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromEntities:
        - world
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: memini
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
    # CNPG operator (status/metrics/SQL channel on the instance)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database

  egress:
    - toEntities:
        - host
        - remote-node
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: memini
    # HuggingFace model downloads; the FQDN rule alone is not materialized by
    # the agent (DNS proxy inactive), so allow plain world:443 egress like immich
    - toFQDNs:
        - matchName: huggingface.co
        - matchName: cdn-lfs.huggingface.co
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
