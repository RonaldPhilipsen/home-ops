---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memini-rerank
  labels:
    app.kubernetes.io/name: memini-rerank
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memini-rerank
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memini-rerank
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-neo-alpha
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
          image: ghcr.io/ggml-org/llama.cpp:server-b5350
          args:
            - -hf
            - Voodisss/Qwen3-Reranker-0.6B-GGUF-llama_cpp:Q4_K_M
            - --alias
            - qwen3-reranker-0.6b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # Qwen3-Reranker needs rank pooling; --reranking + --pooling rank
            # exposes the Cohere-style /v1/rerank endpoint memini calls
            - --reranking
            - --pooling
            - rank
            - --embedding
            - --ctx-size
            - "8192"
            - --parallel
            - "2"
            - --batch-size
            - "8192"
            - --ubatch-size
            - "4096"
            - --no-mmap
            - "300"
            - --metrics
          env:
            - name: HF_HOME
              value: /models
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 240
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
      volumes:
        - name: models
          emptyDir: {}
        - name: tmp
          emptyDir: {}
