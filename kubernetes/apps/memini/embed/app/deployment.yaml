---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memini-embed
  labels:
    app.kubernetes.io/name: memini-embed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memini-embed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memini-embed
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-neo-alpha
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
          image: ghcr.io/ggml-org/llama.cpp:server-rocm-b11783
          args:
            - -hf
            - Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
            - --alias
            - qwen3-embedding-0.6b
            - --port
            - "8000"
            - --flash-attn
            - "on"
            # Qwen3-Embedding uses last-token pooling with left padding;
            # --embedding + --pooling last exposes /v1/embeddings
            - --embedding
            - --pooling
            - last
            - --ctx-size
            - "8192"
            - --parallel
            - "2"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "4096"
            - --cache-ram
            - "0"
            - --sleep-idle-seconds
            - "300"
            - --metrics
          env:
            - name: HF_HOME
              value: /models
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 240
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
      volumes:
        - name: models
          emptyDir: {}
        - name: tmp
          emptyDir: {}
