---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api_key: "{{ .api_key }}"
        password: "{{ .MEMINI_POSTGRES_PASSWORD }}"
        dsn: "postgresql://memini:{{ .MEMINI_POSTGRES_PASSWORD }}@memini-rn.memini.svc:5432/memini?sslmode=disable"
  dataFrom:
    - extract:
        key: memini
