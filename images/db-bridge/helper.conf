# spiffe-helper configuration for the db-bridge sidecar (HCL format).
# The SVID files land in /spiffe (emptyDir) where the bridge reads them on
# every new upstream connection.
#
# bare socket path: spiffe-helper prefixes "unix://" itself.
# The CSI driver bind-mounts the agent socket dir; the socket is
# spire-agent.sock with api.sock/socket aliases (no agent.sock file).
agent_address = "/run/spiffe/api.sock"
cert_dir = "/spiffe"
svid_file_name = "svid.crt"
svid_key_file_name = "svid.key"
svid_bundle_file_name = "bundle.crt"
