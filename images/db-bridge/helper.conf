# spiffe-helper configuration for the db-bridge sidecar (HCL format).
# The SVID files land in /spiffe (emptyDir) where pgbouncer reads them;
# on every renewal spiffe-helper SIGHUPs pgbouncer so it picks up the
# new client cert in place.
# bare socket path: spiffe-helper prefixes "unix://" itself
agent_address = "/run/spiffe/agent.sock"
cert_dir = "/spiffe"
svid_file_name = "svid.crt"
svid_key_file_name = "svid.key"
svid_bundle_file_name = "bundle.crt"
renew_signal = "SIGHUP"
cmd = "kill -HUP $(cat /tmp/pgbouncer.pid) 2>/dev/null || true"
