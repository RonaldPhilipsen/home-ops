name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-exposure:
    name: public-exposure-label
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --quiet pyyaml
      - name: Check public exposure labels
        run: python scripts/lint_public_exposure.py
